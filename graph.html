<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supply Chain Management — Knowledge Graph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg-primary: #0f1118;
  --bg-secondary: #161922;
  --bg-tertiary: #1c2030;
  --bg-panel: #12141e;
  --text-primary: #e8e6e1;
  --text-secondary: #9b9a97;
  --text-muted: #5c5b59;
  --accent: #4fd1a0;
  --accent-glow: rgba(79, 209, 160, 0.15);
  --border: rgba(255,255,255,0.06);
  --border-active: rgba(79, 209, 160, 0.3);
  --link-color: rgba(255,255,255,0.12);
  --shadow: 0 8px 32px rgba(0,0,0,0.4);
  --radius: 10px;
  --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}

body.light {
  --bg-primary: #f5f2ed;
  --bg-secondary: #ebe8e2;
  --bg-tertiary: #e0ddd6;
  --bg-panel: #faf8f5;
  --text-primary: #1a1a1a;
  --text-secondary: #5c5b59;
  --text-muted: #9b9a97;
  --accent: #2a9d6e;
  --accent-glow: rgba(42, 157, 110, 0.1);
  --border: rgba(0,0,0,0.08);
  --border-active: rgba(42, 157, 110, 0.3);
  --link-color: rgba(0,0,0,0.1);
  --shadow: 0 8px 32px rgba(0,0,0,0.08);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  overflow: hidden;
  height: 100vh;
  width: 100vw;
  transition: background var(--transition), color var(--transition);
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  opacity: 0.03;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 9999;
}

/* ── Header ── */
.header {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 12px 24px;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(12px);
  transition: background var(--transition), border var(--transition);
}

.header-title {
  font-family: 'Playfair Display', serif;
  font-weight: 900;
  font-size: 18px;
  letter-spacing: -0.02em;
  white-space: nowrap;
  color: var(--text-primary);
}

.header-title span { color: var(--accent); }
.header-sep { width: 1px; height: 24px; background: var(--border); flex-shrink: 0; }

/* ── Search ── */
.search-wrap { position: relative; flex: 0 1 320px; }
.search-wrap svg {
  position: absolute; left: 12px; top: 50%;
  transform: translateY(-50%);
  width: 16px; height: 16px;
  color: var(--text-muted);
  pointer-events: none;
}
.search-input {
  width: 100%;
  padding: 8px 36px 8px 36px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg-tertiary);
  color: var(--text-primary);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  outline: none;
  transition: border var(--transition), background var(--transition);
}
.search-input::placeholder { color: var(--text-muted); }
.search-input:focus { border-color: var(--border-active); }
.search-clear {
  position: absolute; right: 8px; top: 50%;
  transform: translateY(-50%);
  width: 20px; height: 20px;
  border: none; background: var(--bg-tertiary);
  color: var(--text-muted); border-radius: 4px;
  cursor: pointer; display: none;
  align-items: center; justify-content: center;
  font-size: 14px; line-height: 1;
}
.search-clear.visible { display: flex; }
.search-count { font-size: 11px; color: var(--text-muted); white-space: nowrap; min-width: 60px; }

/* ── Buttons ── */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 14px; border: 1px solid var(--border);
  border-radius: 7px; background: var(--bg-tertiary);
  color: var(--text-secondary); font-family: 'DM Sans', sans-serif;
  font-size: 12px; font-weight: 500; cursor: pointer;
  white-space: nowrap; transition: all var(--transition);
  text-decoration: none;
}
.btn:hover { border-color: var(--border-active); color: var(--text-primary); background: var(--accent-glow); }
.btn svg { width: 14px; height: 14px; }
.header-actions { display: flex; gap: 8px; margin-left: auto; align-items: center; }

/* ── Zoom controls ── */
.zoom-controls {
  position: fixed; bottom: 24px; left: 24px; z-index: 100;
  display: flex; flex-direction: column; gap: 4px;
  background: var(--bg-secondary); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 4px;
  box-shadow: var(--shadow);
  transition: background var(--transition), border var(--transition);
}
.zoom-btn {
  width: 36px; height: 36px; border: none; background: transparent;
  color: var(--text-secondary); border-radius: 6px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; transition: all var(--transition);
}
.zoom-btn:hover { background: var(--accent-glow); color: var(--accent); }
.zoom-level {
  text-align: center; font-size: 10px;
  font-family: 'JetBrains Mono', monospace;
  color: var(--text-muted); padding: 2px 0;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}

/* ── Filter panel (left) ── */
.filter-panel {
  position: fixed; top: 56px; left: 0;
  width: 240px; height: calc(100vh - 56px);
  background: var(--bg-panel);
  border-right: 1px solid var(--border);
  z-index: 90; overflow-y: auto;
  padding: 16px;
  transition: background var(--transition), border var(--transition), transform var(--transition);
}
.filter-panel h3 {
  font-size: 11px; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--text-muted);
  margin-bottom: 10px; font-weight: 600;
}
.filter-group { margin-bottom: 20px; }
.filter-item {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 0; cursor: pointer; font-size: 12px;
  color: var(--text-secondary); transition: color 0.2s;
}
.filter-item:hover { color: var(--text-primary); }
.filter-item input[type="checkbox"] { display: none; }
.filter-dot {
  width: 12px; height: 12px; border-radius: 50%;
  border: 2px solid; flex-shrink: 0;
  transition: all 0.2s;
}
.filter-item input:checked ~ .filter-dot { background: currentColor; }
.filter-line {
  width: 20px; height: 3px; border-radius: 1px; flex-shrink: 0;
}
.filter-actions {
  display: flex; gap: 6px; margin-bottom: 12px;
}
.filter-actions button {
  flex: 1; padding: 5px 8px; border: 1px solid var(--border);
  border-radius: 5px; background: var(--bg-tertiary);
  color: var(--text-muted); font-size: 11px; font-family: 'DM Sans', sans-serif;
  cursor: pointer; transition: all 0.2s;
}
.filter-actions button:hover { border-color: var(--border-active); color: var(--text-primary); }

/* ── SVG canvas ── */
.graph-container {
  position: fixed;
  top: 56px; left: 240px; right: 0; bottom: 0;
}
.graph-container svg { width: 100%; height: 100%; cursor: grab; }
.graph-container svg:active { cursor: grabbing; }

/* ── Detail panel (right) ── */
.detail-panel {
  position: fixed; top: 56px; right: 0;
  width: 380px; height: calc(100vh - 56px);
  background: var(--bg-panel);
  border-left: 1px solid var(--border);
  z-index: 90;
  transform: translateX(100%);
  transition: transform var(--transition), background var(--transition), border var(--transition);
  display: flex; flex-direction: column;
  box-shadow: -8px 0 32px rgba(0,0,0,0.2);
}
.detail-panel.open { transform: translateX(0); }
.detail-header { padding: 20px 24px 16px; border-bottom: 1px solid var(--border); }
.detail-close {
  position: absolute; top: 16px; right: 16px;
  width: 28px; height: 28px;
  border: 1px solid var(--border); border-radius: 6px;
  background: var(--bg-tertiary); color: var(--text-muted);
  cursor: pointer; display: flex; align-items: center;
  justify-content: center; font-size: 16px;
  transition: all var(--transition);
}
.detail-close:hover { color: var(--text-primary); border-color: var(--border-active); }
.detail-breadcrumb {
  display: flex; flex-wrap: wrap; gap: 4px;
  font-size: 11px; color: var(--text-muted);
  margin-bottom: 12px;
  font-family: 'JetBrains Mono', monospace;
}
.detail-breadcrumb .sep { margin: 0 2px; }
.detail-breadcrumb .current { color: var(--accent); font-weight: 500; }
.detail-type {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 20px;
  font-size: 11px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.05em;
  margin-bottom: 12px;
}
.detail-title {
  font-family: 'Playfair Display', serif;
  font-weight: 700; font-size: 20px;
  line-height: 1.3; color: var(--text-primary);
}
.detail-body { flex: 1; overflow-y: auto; padding: 24px; }
.detail-body p { font-size: 14px; line-height: 1.7; color: var(--text-secondary); }
.detail-children { margin-top: 20px; }
.detail-children h4 {
  font-size: 11px; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--text-muted);
  margin-bottom: 10px; font-weight: 600;
}
.detail-child-item {
  padding: 10px 14px; border: 1px solid var(--border);
  border-radius: 8px; margin-bottom: 8px;
  font-size: 13px; color: var(--text-secondary);
  transition: all var(--transition); cursor: pointer;
}
.detail-child-item:hover { border-color: var(--border-active); background: var(--accent-glow); }
.detail-child-item .child-type {
  font-size: 10px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px;
}
.detail-child-item .child-preview { color: var(--text-muted); font-size: 12px; margin-top: 4px; }
.connection-group { margin-top: 16px; }
.connection-group h5 {
  font-size: 11px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.05em; margin-bottom: 8px; display: flex;
  align-items: center; gap: 6px;
}
.connection-group h5 .conn-dot {
  width: 8px; height: 8px; border-radius: 50%;
}
.connection-item {
  padding: 8px 12px; border: 1px solid var(--border);
  border-radius: 6px; margin-bottom: 6px; font-size: 12px;
  color: var(--text-secondary); cursor: pointer;
  transition: all 0.2s;
}
.connection-item:hover { border-color: var(--border-active); background: var(--accent-glow); }
.connection-item .conn-label {
  font-size: 10px; color: var(--text-muted); margin-top: 3px;
}

/* ── Legend ── */
.legend {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%); z-index: 100;
  display: flex; flex-direction: column; gap: 8px;
  padding: 12px 20px;
  background: var(--bg-secondary); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow);
  transition: background var(--transition), border var(--transition);
}
.legend-row { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
.legend-item {
  display: flex; align-items: center; gap: 6px;
  font-size: 10px; color: var(--text-secondary); font-weight: 500;
}
.legend-swatch {
  width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
}
.legend-line {
  width: 20px; height: 0; border-top: 2px; flex-shrink: 0;
}

/* ── Responsive ── */
@media (max-width: 900px) {
  .filter-panel { transform: translateX(-100%); }
  .filter-panel.open { transform: translateX(0); }
  .graph-container { left: 0; }
  .detail-panel { width: 100%; }
}
@media (max-width: 768px) {
  .header { padding: 10px 12px; gap: 8px; flex-wrap: wrap; }
  .header-title { font-size: 14px; }
  .search-wrap { flex: 1 1 100%; order: 10; }
  .legend { gap: 6px; padding: 8px 14px; }
}

/* ── Scrollbar ── */
.detail-body::-webkit-scrollbar, .filter-panel::-webkit-scrollbar, .quiz-panel::-webkit-scrollbar { width: 4px; }
.detail-body::-webkit-scrollbar-track, .filter-panel::-webkit-scrollbar-track, .quiz-panel::-webkit-scrollbar-track { background: transparent; }
.detail-body::-webkit-scrollbar-thumb, .filter-panel::-webkit-scrollbar-thumb, .quiz-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* ── Quiz Mode ── */
.btn.quiz-active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}

.quiz-panel {
  position: fixed; top: 56px; left: 0;
  width: 300px; height: calc(100vh - 56px);
  background: var(--bg-panel);
  border-right: 1px solid var(--border);
  z-index: 91; overflow-y: auto;
  padding: 20px;
  transition: background var(--transition), border var(--transition);
}

body.quiz-mode .filter-panel { display: none !important; }
body.quiz-mode .graph-container { left: 300px; }
body.quiz-mode .zoom-controls { left: 324px; }

.quiz-panel h3 {
  font-size: 11px; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--text-muted);
  margin-bottom: 12px; font-weight: 600;
}

/* Setup screen */
.quiz-section-list { margin-bottom: 16px; }
.quiz-section-item {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 0; cursor: pointer; font-size: 12px;
  color: var(--text-secondary); transition: color 0.2s;
}
.quiz-section-item:hover { color: var(--text-primary); }
.quiz-section-item input[type="checkbox"] { display: none; }
.quiz-section-item .filter-dot { transition: all 0.2s; }
.quiz-section-item input:checked ~ .filter-dot { background: currentColor; }

.quiz-difficulty-group { margin-bottom: 16px; }
.quiz-difficulty-group label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); margin-bottom: 8px; font-weight: 600; }
.quiz-seg-control {
  display: flex; border: 1px solid var(--border); border-radius: 7px; overflow: hidden;
}
.quiz-seg-btn {
  flex: 1; padding: 7px 0; border: none; background: var(--bg-tertiary);
  color: var(--text-secondary); font-family: 'DM Sans', sans-serif;
  font-size: 12px; font-weight: 500; cursor: pointer;
  transition: all 0.2s; text-align: center;
}
.quiz-seg-btn:not(:last-child) { border-right: 1px solid var(--border); }
.quiz-seg-btn.active { background: var(--accent); color: #fff; }
.quiz-seg-btn:hover:not(.active) { background: var(--accent-glow); color: var(--text-primary); }

.quiz-count-group { margin-bottom: 16px; }
.quiz-count-group label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); margin-bottom: 8px; font-weight: 600; }
.quiz-count-row { display: flex; align-items: center; gap: 12px; }
.quiz-count-slider {
  flex: 1; -webkit-appearance: none; appearance: none;
  height: 4px; border-radius: 2px; background: var(--border);
  outline: none;
}
.quiz-count-slider::-webkit-slider-thumb {
  -webkit-appearance: none; width: 16px; height: 16px;
  border-radius: 50%; background: var(--accent); cursor: pointer;
}
.quiz-count-val {
  font-family: 'JetBrains Mono', monospace; font-size: 13px;
  color: var(--text-primary); min-width: 24px; text-align: right;
}

.quiz-timed-toggle {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 20px; font-size: 12px; color: var(--text-secondary);
}
.quiz-toggle-switch {
  position: relative; width: 36px; height: 20px; cursor: pointer;
}
.quiz-toggle-switch input { display: none; }
.quiz-toggle-track {
  position: absolute; inset: 0; border-radius: 10px;
  background: var(--border); transition: background 0.2s;
}
.quiz-toggle-switch input:checked ~ .quiz-toggle-track { background: var(--accent); }
.quiz-toggle-knob {
  position: absolute; top: 2px; left: 2px;
  width: 16px; height: 16px; border-radius: 50%;
  background: #fff; transition: transform 0.2s;
}
.quiz-toggle-switch input:checked ~ .quiz-toggle-knob { transform: translateX(16px); }

.quiz-select-actions {
  display: flex; gap: 6px; margin-bottom: 8px;
}
.quiz-select-actions button {
  flex: 1; padding: 4px 8px; border: 1px solid var(--border);
  border-radius: 5px; background: var(--bg-tertiary);
  color: var(--text-muted); font-size: 11px; font-family: 'DM Sans', sans-serif;
  cursor: pointer; transition: all 0.2s;
}
.quiz-select-actions button:hover { border-color: var(--border-active); color: var(--text-primary); }

.quiz-start-btn {
  width: 100%; padding: 10px; border: none; border-radius: 8px;
  background: var(--accent); color: #fff;
  font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600;
  cursor: pointer; transition: all 0.2s;
}
.quiz-start-btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
.quiz-start-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

/* Active quiz screen */
.quiz-header-row {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px;
}
.quiz-score-display {
  font-family: 'JetBrains Mono', monospace; font-size: 13px;
  color: var(--accent); font-weight: 600;
}
.quiz-streak-display {
  font-size: 11px; color: var(--text-muted);
}
.quiz-streak-display.on-fire { color: #f28e2b; font-weight: 600; }

.quiz-progress { width: 100%; height: 4px; background: var(--border); border-radius: 2px; margin-bottom: 16px; }
.quiz-progress-fill { height: 100%; border-radius: 2px; background: var(--accent); transition: width 0.4s ease; }

.quiz-question-num {
  font-size: 11px; color: var(--text-muted); margin-bottom: 6px;
  display: flex; align-items: center; gap: 8px;
}

.quiz-timer-ring {
  width: 28px; height: 28px; flex-shrink: 0;
}
.quiz-timer-ring circle {
  fill: none; stroke-width: 3;
}
.quiz-timer-bg { stroke: var(--border); }
.quiz-timer-fg {
  stroke: var(--accent);
  stroke-linecap: round;
  transform: rotate(-90deg);
  transform-origin: center;
  transition: stroke-dashoffset 1s linear, stroke 0.3s;
}
.quiz-timer-fg.urgent { stroke: #e15759; }
.quiz-timer-text {
  font-family: 'JetBrains Mono', monospace; font-size: 8px;
  fill: var(--text-muted); text-anchor: middle; dominant-baseline: central;
}

.quiz-question-text {
  font-size: 14px; line-height: 1.6; color: var(--text-primary);
  margin-bottom: 16px; font-weight: 500;
}

.quiz-options { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.quiz-option {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 12px; border: 1px solid var(--border);
  border-radius: 8px; cursor: pointer; font-size: 13px;
  color: var(--text-secondary); transition: all 0.2s;
  line-height: 1.5; position: relative;
}
.quiz-option:hover:not(.locked) { border-color: var(--border-active); background: var(--accent-glow); color: var(--text-primary); }
.quiz-option .opt-key {
  width: 22px; height: 22px; border-radius: 50%;
  border: 1.5px solid var(--border); display: flex;
  align-items: center; justify-content: center;
  font-size: 11px; font-weight: 600; flex-shrink: 0;
  font-family: 'JetBrains Mono', monospace;
  transition: all 0.2s;
}
.quiz-option.selected { border-color: var(--accent); background: var(--accent-glow); }
.quiz-option.selected .opt-key { border-color: var(--accent); background: var(--accent); color: #fff; }
.quiz-option.correct {
  border-color: #4caf7a; background: rgba(76, 175, 122, 0.1);
  animation: correctFlash 0.5s ease;
}
.quiz-option.correct .opt-key { border-color: #4caf7a; background: #4caf7a; color: #fff; }
.quiz-option.wrong {
  border-color: #e15759; background: rgba(225, 87, 89, 0.1);
  animation: wrongShake 0.4s ease;
}
.quiz-option.wrong .opt-key { border-color: #e15759; background: #e15759; color: #fff; }
.quiz-option.locked { cursor: default; opacity: 0.6; }
.quiz-option.correct.locked { opacity: 1; }

.quiz-explanation {
  display: none; padding: 12px; border-radius: 8px;
  background: var(--bg-tertiary); border: 1px solid var(--border);
  font-size: 12px; line-height: 1.6; color: var(--text-secondary);
  margin-bottom: 12px;
}
.quiz-explanation.visible { display: block; }
.quiz-explanation strong { color: var(--text-primary); }

.quiz-nav-row {
  display: flex; gap: 8px;
}
.quiz-nav-btn {
  flex: 1; padding: 8px; border: 1px solid var(--border);
  border-radius: 7px; background: var(--bg-tertiary);
  color: var(--text-secondary); font-family: 'DM Sans', sans-serif;
  font-size: 12px; font-weight: 500; cursor: pointer;
  transition: all 0.2s;
}
.quiz-nav-btn:hover { border-color: var(--border-active); color: var(--text-primary); }
.quiz-nav-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.quiz-nav-btn.primary:hover { filter: brightness(1.1); }
.quiz-nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }

.quiz-view-graph-btn {
  display: none; width: 100%; margin-top: 8px; padding: 6px;
  border: 1px solid var(--border); border-radius: 6px;
  background: var(--bg-tertiary); color: var(--text-muted);
  font-size: 11px; font-family: 'DM Sans', sans-serif;
  cursor: pointer; transition: all 0.2s;
}
.quiz-view-graph-btn.visible { display: block; }
.quiz-view-graph-btn:hover { border-color: var(--border-active); color: var(--text-primary); }

/* Results screen */
.quiz-results-header {
  text-align: center; margin-bottom: 20px;
}
.quiz-results-header h3 {
  font-family: 'Playfair Display', serif; font-size: 18px;
  font-weight: 700; color: var(--text-primary);
  text-transform: none; letter-spacing: normal; margin-bottom: 16px;
}
.quiz-progress-ring {
  display: block; margin: 0 auto 12px;
}
.quiz-ring-bg { fill: none; stroke: var(--border); stroke-width: 6; }
.quiz-ring-fg {
  fill: none; stroke-width: 6; stroke-linecap: round;
  transform: rotate(-90deg); transform-origin: center;
  transition: stroke-dashoffset 1.2s ease;
}
.quiz-score-big {
  font-family: 'Playfair Display', serif; font-size: 36px;
  font-weight: 900; color: var(--text-primary);
}
.quiz-score-pct {
  font-size: 14px; color: var(--text-muted); font-weight: 400;
}
.quiz-grade {
  display: inline-block; padding: 4px 14px; border-radius: 20px;
  font-size: 14px; font-weight: 700; margin-top: 8px;
}

.quiz-stats-row {
  display: flex; gap: 8px; margin-bottom: 16px;
}
.quiz-stat-card {
  flex: 1; padding: 10px; border: 1px solid var(--border);
  border-radius: 8px; text-align: center;
}
.quiz-stat-val {
  font-family: 'JetBrains Mono', monospace; font-size: 16px;
  font-weight: 600; color: var(--text-primary);
}
.quiz-stat-label {
  font-size: 10px; color: var(--text-muted); text-transform: uppercase;
  letter-spacing: 0.05em; margin-top: 2px;
}

.quiz-section-breakdown { margin-bottom: 16px; }
.quiz-breakdown-item {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 0; font-size: 12px; color: var(--text-secondary);
}
.quiz-breakdown-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
}
.quiz-breakdown-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.quiz-breakdown-bar {
  width: 60px; height: 4px; border-radius: 2px;
  background: var(--border); overflow: hidden; flex-shrink: 0;
}
.quiz-breakdown-fill { height: 100%; border-radius: 2px; transition: width 0.8s ease; }
.quiz-breakdown-score { font-family: 'JetBrains Mono', monospace; font-size: 11px; min-width: 32px; text-align: right; }

.quiz-sparkline-wrap { margin-bottom: 16px; }
.quiz-sparkline-wrap h3 { margin-bottom: 8px; }
.quiz-sparkline {
  width: 100%; height: 40px;
}
.quiz-sparkline polyline {
  fill: none; stroke: var(--accent); stroke-width: 1.5;
}
.quiz-sparkline .spark-area {
  fill: var(--accent-glow); stroke: none;
}
.quiz-sparkline circle {
  fill: var(--accent);
}

.quiz-results-actions {
  display: flex; flex-direction: column; gap: 8px;
}

/* Streak toast */
.quiz-toast {
  position: fixed; top: 72px; left: 50%; transform: translateX(-50%);
  padding: 8px 20px; border-radius: 20px;
  font-size: 13px; font-weight: 600; z-index: 200;
  pointer-events: none; opacity: 0;
  transition: opacity 0.3s, transform 0.3s;
}
.quiz-toast.show {
  opacity: 1; transform: translateX(-50%) translateY(0);
}
.quiz-toast.nice { background: #4caf7a; color: #fff; }
.quiz-toast.fire { background: #f28e2b; color: #fff; }
.quiz-toast.legendary { background: linear-gradient(135deg, #f28e2b, #e15759); color: #fff; }

/* Mastery heat map toggle */
.btn.mastery-active {
  background: linear-gradient(135deg, #4caf7a33, #e1575933);
  border-color: var(--accent);
}

/* Quiz animations */
@keyframes quizPulse {
  0%, 100% { r: attr(r); opacity: 1; }
  50% { opacity: 0.7; }
}
@keyframes correctFlash {
  0% { transform: scale(1); }
  50% { transform: scale(1.02); }
  100% { transform: scale(1); }
}
@keyframes wrongShake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-6px); }
  40% { transform: translateX(6px); }
  60% { transform: translateX(-4px); }
  80% { transform: translateX(4px); }
}
@keyframes ringFill {
  from { stroke-dashoffset: 283; }
}
@keyframes scoreCountUp {
  from { opacity: 0; transform: scale(0.5); }
  to { opacity: 1; transform: scale(1); }
}
@keyframes confettiFall {
  0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
  100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}
@keyframes edgeFlow {
  to { stroke-dashoffset: -20; }
}
@keyframes pathDot {
  0% { offset-distance: 0%; opacity: 1; }
  100% { offset-distance: 100%; opacity: 0.3; }
}

.quiz-highlight-node circle {
  animation: quizPulse 1.2s ease-in-out infinite;
}
.quiz-edge-active {
  stroke-width: 4 !important;
  stroke-opacity: 1 !important;
  animation: edgeFlow 1s linear infinite;
}

/* Confetti */
.confetti-piece {
  position: fixed; top: -10px; z-index: 300;
  width: 8px; height: 8px; border-radius: 2px;
  pointer-events: none;
  animation: confettiFall 3s ease-in forwards;
}

/* Responsive quiz */
@media (max-width: 900px) {
  .quiz-panel {
    width: 100%; height: calc(100vh - 56px);
    z-index: 95;
  }
  body.quiz-mode .graph-container { left: 0; }
  body.quiz-mode .zoom-controls { left: 24px; }
}
</style>

          { name: "Trunk", type: "trunk", detail: "Each type has different holding costs, turnover rates, and management strategies." },
          { name: "Branches", type: "branches", detail: "Safety stock, cycle stock, pipeline inventory, and anticipation inventory serve distinct buffering purposes." },
          { name: "Leaves", type: "leaves", detail: "ABC analysis classifies inventory by value — A items (20% of SKUs, 80% of value) get tight control; C items get simple rules." }
        ]},
        { name: "EOQ & Reorder Points", type: "topic", children: [
          { name: "Roots", type: "roots", detail: "Economic Order Quantity (EOQ) balances ordering costs against holding costs to find the optimal order size." },
          { name: "Trunk", type: "trunk", detail: "EOQ formula: sqrt(2DS/H) where D=annual demand, S=order cost, H=holding cost per unit per year." },
          { name: "Branches", type: "branches", detail: "Reorder Point = (Average Daily Demand x Lead Time) + Safety Stock. Safety stock accounts for demand and lead time variability." },
          { name: "Leaves", type: "leaves", detail: "Extensions include quantity discounts, planned shortages, and stochastic models that handle demand uncertainty probabilistically." }
        ]},
        { name: "Just-In-Time (JIT)", type: "topic", children: [
          { name: "Roots", type: "roots", detail: "JIT minimizes inventory by receiving goods only when needed in the production process." },
          { name: "Trunk", type: "trunk", detail: "Originated at Toyota — requires reliable suppliers, small lot sizes, quick setups, and pull-based production signals (Kanban)." },
          { name: "Branches", type: "branches", detail: "Benefits: reduced holding costs, less waste, improved quality. Risks: vulnerability to supply disruptions, requires stable demand." },
          { name: "Leaves", type: "leaves", detail: "JIT II places supplier representatives on-site to manage replenishment — pioneered by Bose Corporation." }
        ]},
        { name: "Inventory Optimization", type: "topic", children: [
          { name: "Roots", type: "roots", detail: "Balancing service level targets against inventory investment to minimize total cost." },
          { name: "Trunk", type: "trunk", detail: "Multi-echelon inventory optimization (MEIO) considers the entire network, not just individual locations." },
          { name: "Branches", type: "branches", detail: "Techniques: demand segmentation, postponement, vendor-managed inventory (VMI), and consignment stocking." },
          { name: "Leaves", type: "leaves", detail: "Machine learning models improve demand forecasting accuracy by 20-50%, enabling significant inventory reduction." }
        ]},
        { name: "Warehouse Management", type: "topic", children: [
          { name: "Roots", type: "roots", detail: "Planning and controlling warehouse operations — receiving, put-away, storage, picking, packing, and shipping." },
          { name: "Trunk", type: "trunk", detail: "Warehouse Management Systems (WMS) direct operations, optimize slotting, and manage labor productivity." },
          { name: "Branches", type: "branches", detail: "Automation options: conveyor systems, AS/RS, goods-to-person robots, pick-to-light, voice picking, and autonomous mobile robots." },
          { name: "Leaves", type: "leaves", detail: "Dark warehouses (fully automated) and micro-fulfillment centers represent the frontier of warehouse innovation." }
        ]},
        { name: "Demand Forecasting", type: "topic", children: [
          { name: "Roots", type: "roots", detail: "Predicting future customer demand to drive inventory, production, and sourcing decisions." },
          { name: "Trunk", type: "trunk", detail: "Methods: qualitative (expert judgment, Delphi) and quantitative (moving averages, exponential smoothing, regression, ARIMA)." },
          { name: "Branches", type: "branches", detail: "Demand sensing uses real-time POS data, social media signals, and weather data to improve short-term forecast accuracy." },
          { name: "Leaves", type: "leaves", detail: "Machine learning approaches (neural networks, gradient boosting) outperform traditional methods for complex, non-linear demand patterns." }
        ]}
      ]
    },
    {
      name: "D — Logistics & Transportation", type: "section", sectionIndex: 3,
      children: [
        { name: "Transportation Modes", type: "topic", children: [
          { name: "Roots", type: "roots", detail: "Five primary modes: road (truck), rail, ocean, air, and pipeline. Each has distinct cost/speed/capacity tradeoffs." },
          { name: "Trunk", type: "trunk", detail: "Intermodal transport combines modes for efficiency — e.g., ocean + rail + truck for international shipments." },
          { name: "Branches", type: "branches", detail: "Mode selection factors: distance, weight, volume, value, urgency, reliability, and environmental impact." },
          { name: "Leaves", type: "leaves", detail: "Emerging modes: drones for last-mile, autonomous trucks, hyperloop for freight, and electric/hydrogen-powered vehicles." }
        ]},
        { name: "Freight Management", type: "topic", children: [
          { name: "Roots", type: "roots", detail: "Planning, executing, and optimizing the movement of goods through the transportation network." },
          { name: "Trunk", type: "trunk", detail: "Key functions: carrier selection, rate negotiation, shipment consolidation, routing, and freight audit/payment." },
          { name: "Branches", type: "branches", detail: "Transportation Management Systems (TMS) optimize carrier selection, routing, and load planning across the network." },
          { name: "Leaves", type: "leaves", detail: "Digital freight platforms and real-time visibility tools transform freight management transparency." }
        ]},
        { name: "Last-Mile Delivery", type: "topic", children: [
          { name: "Roots", type: "roots", detail: "The final step of delivery from distribution center to customer — often the most expensive and complex part." },
          { name: "Trunk", type: "trunk", detail: "Challenges: high cost per delivery, failed deliveries, customer time-window expectations, and urban congestion." },
          { name: "Branches", type: "branches", detail: "Solutions: route optimization, crowdsourced delivery, locker networks, micro-fulfillment centers, and dynamic delivery windows." },
          { name: "Leaves", type: "leaves", detail: "Autonomous delivery robots, drone delivery programs, and same-hour delivery innovations." }
        ]},
        { name: "Distribution Network Design", type: "topic", children: [
          { name: "Roots", type: "roots", detail: "Determining the number, location, and role of warehouses and distribution centers in the supply chain." },
          { name: "Trunk", type: "trunk", detail: "Tradeoffs: more DCs improve service speed but increase inventory and facility costs. Fewer DCs reduce cost but slow delivery." },
          { name: "Branches", type: "branches", detail: "Network optimization models balance transportation costs, inventory costs, facility costs, and customer service requirements." },
          { name: "Leaves", type: "leaves", detail: "Omnichannel networks blur boundaries — stores become fulfillment centers, and forward-positioned inventory enables same-day delivery." }
        ]},
        { name: "Reverse Logistics", type: "topic", children: [
          { name: "Roots", type: "roots", detail: "Managing the flow of products from customer back to the company — returns, repairs, recycling, disposal." },
          { name: "Trunk", type: "trunk", detail: "Processes: return authorization, collection, inspection, disposition (refurbish, remanufacture, recycle, dispose)." },
          { name: "Branches", type: "branches", detail: "Cost of returns is 2-3x forward logistics. Effective reverse logistics recovers value and improves customer loyalty." },
          { name: "Leaves", type: "leaves", detail: "Circular economy principles integrate reverse logistics into product design — designing for disassembly and material recovery." }
        ]},
        { name: "3PL & 4PL", type: "topic", children: [
          { name: "Roots", type: "roots", detail: "Third-party logistics (3PL) outsources warehousing and transportation. Fourth-party logistics (4PL) manages the entire supply chain." },
          { name: "Trunk", type: "trunk", detail: "3PL benefits: scalability, expertise, technology access, reduced capital investment. 4PL adds strategic management and integration." },
          { name: "Branches", type: "branches", detail: "Selection criteria: industry expertise, technology capabilities, geographic coverage, financial stability, and cultural fit." },
          { name: "Leaves", type: "leaves", detail: "Digital 3PLs combine traditional logistics with technology platforms for end-to-end visibility." }
        ]}
      ]
    },
    {
      name: "E — Manufacturing & Production", type: "section", sectionIndex: 4,
      children: [
        { name: "Production Strategies", type: "topic", children: [
          { name: "Roots", type: "roots", detail: "Three primary strategies: Make-to-Stock (MTS), Make-to-Order (MTO), and Assemble-to-Order (ATO)." },
          { name: "Trunk", type: "trunk", detail: "MTS forecasts demand and builds inventory. MTO waits for orders. ATO pre-builds components, assembles on order." },
          { name: "Branches", type: "branches", detail: "Engineer-to-Order (ETO) for custom products. The customer order decoupling point determines which strategy applies." },
          { name: "Leaves", type: "leaves", detail: "Mass customization combines MTS efficiency with MTO personalization — think Dell's configure-to-order model." }
        ]},
        { name: "Lean Manufacturing", type: "topic", children: [
          { name: "Roots", type: "roots", detail: "Systematic elimination of waste (muda) while delivering value from the customer's perspective." },
          { name: "Trunk", type: "trunk", detail: "Seven wastes: overproduction, waiting, transportation, overprocessing, inventory, motion, and defects. Some add unused talent as #8." },
          { name: "Branches", type: "branches", detail: "Tools: 5S, Kanban, value stream mapping, poka-yoke (error-proofing), kaizen events, and one-piece flow." },
          { name: "Leaves", type: "leaves", detail: "Lean extends beyond manufacturing to lean supply chains — reducing waste across the entire value network." }
        ]},
        { name: "Six Sigma", type: "topic", children: [
          { name: "Roots", type: "roots", detail: "A data-driven methodology for eliminating defects — targeting 3.4 defects per million opportunities." },
          { name: "Trunk", type: "trunk", detail: "DMAIC cycle: Define, Measure, Analyze, Improve, Control. Each phase has specific tools and deliverables." },
          { name: "Branches", type: "branches", detail: "Key tools: process capability analysis, control charts, FMEA, hypothesis testing, regression, and design of experiments." },
          { name: "Leaves", type: "leaves", detail: "Lean Six Sigma combines waste elimination with variation reduction — belt certification (Green, Black, Master Black Belt) validates expertise." }
        ]},
        { name: "Capacity Planning", type: "topic", children: [
          { name: "Roots", type: "roots", detail: "Determining the production capacity needed to meet changing demand over time." },
          { name: "Trunk", type: "trunk", detail: "Levels: long-range (facilities, equipment), medium-range (workforce, subcontracting), short-range (scheduling, overtime)." },
          { name: "Branches", type: "branches", detail: "Strategies: lead (build ahead of demand), lag (build after demand confirmed), match (incremental additions)." },
          { name: "Leaves", type: "leaves", detail: "Theory of Constraints (TOC) identifies and manages bottleneck resources to maximize overall throughput." }
        ]},
        { name: "Quality Management", type: "topic", children: [
          { name: "Roots", type: "roots", detail: "Ensuring products and services consistently meet customer requirements and expectations." },
          { name: "Trunk", type: "trunk", detail: "Total Quality Management (TQM) involves everyone in continuous improvement. ISO 9001 provides a quality management system framework." },
          { name: "Branches", type: "branches", detail: "Statistical process control (SPC), quality function deployment (QFD), and supplier quality management are key tools." },
          { name: "Leaves", type: "leaves", detail: "Cost of quality framework: prevention costs + appraisal costs + internal/external failure costs. Investing in prevention reduces total cost." }
        ]},
        { name: "Production Scheduling", type: "topic", children: [
          { name: "Roots", type: "roots", detail: "Allocating resources and sequencing jobs to meet demand efficiently." },
          { name: "Trunk", type: "trunk", detail: "Master Production Schedule (MPS) drives Material Requirements Planning (MRP), which drives shop floor scheduling." },
          { name: "Branches", type: "branches", detail: "Advanced Planning and Scheduling (APS) systems use optimization algorithms to consider constraints simultaneously." },
          { name: "Leaves", type: "leaves", detail: "Digital twins of production lines enable simulation and real-time schedule optimization." }
        ]}
      ]
    },
    {
      name: "F — Technology & Digitalization", type: "section", sectionIndex: 5,
      children: [
        { name: "ERP Systems", type: "topic", children: [
          { name: "Roots", type: "roots", detail: "Enterprise Resource Planning integrates all business processes into a single system." },
          { name: "Trunk", type: "trunk", detail: "Core modules: finance, HR, manufacturing, supply chain, procurement, sales. SAP, Oracle, and Microsoft Dynamics lead the market." },
          { name: "Branches", type: "branches", detail: "Cloud ERP enables faster deployment, lower upfront costs, and automatic updates. Two-tier ERP supports global + local needs." },
          { name: "Leaves", type: "leaves", detail: "Intelligent ERP embeds AI/ML for predictive analytics, process automation, and conversational interfaces." }
        ]},
        { name: "IoT in Supply Chain", type: "topic", children: [
          { name: "Roots", type: "roots", detail: "Internet of Things connects physical assets to digital networks via sensors, RFID, and GPS." },
          { name: "Trunk", type: "trunk", detail: "Applications: real-time tracking, condition monitoring (temperature, humidity), predictive maintenance, and smart warehousing." },
          { name: "Branches", type: "branches", detail: "Edge computing processes IoT data locally for faster response. Digital twins create virtual replicas of physical supply chain assets." },
          { name: "Leaves", type: "leaves", detail: "Cold chain monitoring ensures pharmaceutical and food safety compliance with continuous temperature logging and alerts." }
        ]},
        { name: "Blockchain in SCM", type: "topic", children: [
          { name: "Roots", type: "roots", detail: "Distributed ledger technology providing immutable, transparent records of supply chain transactions." },
          { name: "Trunk", type: "trunk", detail: "Use cases: provenance tracking, counterfeit prevention, trade finance, and automated compliance documentation." },
          { name: "Branches", type: "branches", detail: "Enterprise blockchain applications demonstrate value in food safety and shipping traceability." },
          { name: "Leaves", type: "leaves", detail: "Challenges: scalability, energy consumption, interoperability between platforms, and achieving critical mass of participants." }
        ]},
        { name: "AI & Machine Learning", type: "topic", children: [
          { name: "Roots", type: "roots", detail: "Artificial intelligence enables computers to perform tasks that normally require human intelligence." },
          { name: "Trunk", type: "trunk", detail: "SCM applications: demand forecasting, route optimization, quality inspection, supplier risk assessment, and autonomous vehicles." },
          { name: "Branches", type: "branches", detail: "Natural language processing powers chatbots for order tracking. Computer vision automates warehouse operations and quality control." },
          { name: "Leaves", type: "leaves", detail: "Generative AI creates supply chain simulations and scenario plans. Reinforcement learning optimizes dynamic pricing and inventory policies." }
        ]},
        { name: "Robotic Process Automation", type: "topic", children: [
          { name: "Roots", type: "roots", detail: "RPA uses software robots to automate repetitive, rule-based tasks across supply chain processes." },
          { name: "Trunk", type: "trunk", detail: "Common automations: invoice processing, order entry, shipment tracking updates, and inventory reconciliation." },
          { name: "Branches", type: "branches", detail: "Intelligent automation combines RPA with AI for handling exceptions and making judgments on unstructured data." },
          { name: "Leaves", type: "leaves", detail: "Hyperautomation orchestrates RPA, AI, process mining, and low-code tools to automate end-to-end supply chain workflows." }
        ]},
        { name: "Digital Twins", type: "topic", children: [
          { name: "Roots", type: "roots", detail: "Virtual replicas of physical supply chain assets, processes, and networks that simulate real-world behavior." },
          { name: "Trunk", type: "trunk", detail: "Enable what-if analysis, scenario planning, and optimization without disrupting actual operations." },
          { name: "Branches", type: "branches", detail: "Supply chain digital twins model entire networks — testing disruption responses, capacity changes, and new supplier options." },
          { name: "Leaves", type: "leaves", detail: "Real-time digital twins continuously sync with live data for dynamic optimization and autonomous decision-making." }
        ]}
      ]
    },
    {
      name: "G — Risk & Resilience", type: "section", sectionIndex: 6,
      children: [
        { name: "Supply Chain Risks", type: "topic", children: [
          { name: "Roots", type: "roots", detail: "Risks that can disrupt the flow of materials, information, or finances in the supply chain." },
          { name: "Trunk", type: "trunk", detail: "Categories: operational (quality, capacity), financial (currency, credit), strategic (competitive, regulatory), and hazard (natural disasters, pandemics)." },
          { name: "Branches", type: "branches", detail: "Geopolitical risks (trade wars, sanctions), cyber risks (ransomware, data breaches), and climate risks (extreme weather) are increasingly prominent." },
          { name: "Leaves", type: "leaves", detail: "Risk quantification uses probability x impact matrices, Monte Carlo simulation, and value-at-risk (VaR) models." }
        ]},
        { name: "Risk Mitigation", type: "topic", children: [
          { name: "Roots", type: "roots", detail: "Strategies to reduce the likelihood or impact of supply chain disruptions." },
          { name: "Trunk", type: "trunk", detail: "Common strategies: dual sourcing, safety stock, supplier audits, business continuity planning, and insurance." },
          { name: "Branches", type: "branches", detail: "Supply chain mapping reveals hidden dependencies — tier 2 and tier 3 suppliers often concentrate risk." },
          { name: "Leaves", type: "leaves", detail: "AI-powered risk monitoring scans news, weather, financial, and social media data for early warning signals." }
        ]},
        { name: "Business Continuity Planning", type: "topic", children: [
          { name: "Roots", type: "roots", detail: "Preparing plans to maintain critical supply chain functions during and after a disruption." },
          { name: "Trunk", type: "trunk", detail: "BCP elements: risk assessment, business impact analysis, recovery strategies, plan development, and testing/exercises." },
          { name: "Branches", type: "branches", detail: "Recovery time objectives (RTO) and recovery point objectives (RPO) define acceptable downtime and data loss." },
          { name: "Leaves", type: "leaves", detail: "Pandemic planning became a critical BCP component — diversified sourcing, remote operations, and demand replanning capabilities." }
        ]},
        { name: "Supply Chain Resilience", type: "topic", children: [
          { name: "Roots", type: "roots", detail: "The ability to anticipate, prepare for, respond to, and recover from disruptions." },
          { name: "Trunk", type: "trunk", detail: "Resilience dimensions: flexibility (adapt quickly), velocity (recover fast), visibility (see problems early), and collaboration (work together)." },
          { name: "Branches", type: "branches", detail: "Building resilience often requires trade-offs with efficiency — redundancy costs money but provides protection." },
          { name: "Leaves", type: "leaves", detail: "Antifragile supply chains don't just survive disruptions — they get stronger through stress testing and learning." }
        ]},
        { name: "Cybersecurity in SCM", type: "topic", children: [
          { name: "Roots", type: "roots", detail: "Protecting supply chain systems, data, and networks from cyber threats." },
          { name: "Trunk", type: "trunk", detail: "Threats: ransomware, phishing, supply chain attacks, data breaches, and IoT device vulnerabilities." },
          { name: "Branches", type: "branches", detail: "Defense layers: network segmentation, multi-factor authentication, encryption, supplier security assessments, and incident response plans." },
          { name: "Leaves", type: "leaves", detail: "Zero-trust architecture and software bill of materials (SBOM) represent emerging best practices for supply chain cybersecurity." }
        ]}
      ]
    },
    {
      name: "H — Sustainability & Ethics", type: "section", sectionIndex: 7,
      children: [
        { name: "Green Supply Chain", type: "topic", children: [
          { name: "Roots", type: "roots", detail: "Integrating environmental considerations into every stage of the supply chain." },
          { name: "Trunk", type: "trunk", detail: "Key areas: green procurement, eco-design, clean production, green logistics, and end-of-life management." },
          { name: "Branches", type: "branches", detail: "Carbon footprint measurement across Scope 1 (direct), Scope 2 (energy), and Scope 3 (supply chain) emissions." },
          { name: "Leaves", type: "leaves", detail: "Science-based targets (SBTi) and net-zero commitments drive aggressive supply chain decarbonization programs." }
        ]},
        { name: "Circular Economy", type: "topic", children: [
          { name: "Roots", type: "roots", detail: "An economic model that eliminates waste by keeping materials in use through reuse, repair, and recycling." },
          { name: "Trunk", type: "trunk", detail: "Contrast with linear economy (take-make-dispose). Circular design considers the full lifecycle from material selection to end-of-life." },
          { name: "Branches", type: "branches", detail: "Business models: product-as-a-service, sharing platforms, refurbishment programs, and material marketplaces." },
          { name: "Leaves", type: "leaves", detail: "Digital product passports track material composition and recycling instructions throughout the product lifecycle." }
        ]},
        { name: "ESG Reporting", type: "topic", children: [
          { name: "Roots", type: "roots", detail: "Environmental, Social, and Governance reporting measures and discloses sustainability performance." },
          { name: "Trunk", type: "trunk", detail: "Frameworks: GRI (Global Reporting Initiative), SASB, TCFD, and the emerging ISSB standards." },
          { name: "Branches", type: "branches", detail: "Supply chain ESG extends reporting to suppliers — requiring carbon disclosure, labor audits, and governance assessments." },
          { name: "Leaves", type: "leaves", detail: "EU regulations (CSRD, CSDDD) mandate supply chain due diligence and sustainability reporting for large companies." }
        ]},
        { name: "Social Responsibility", type: "topic", children: [
          { name: "Roots", type: "roots", detail: "Ensuring supply chain practices respect human rights, fair labor, and community welfare." },
          { name: "Trunk", type: "trunk", detail: "Key issues: forced labor, child labor, living wages, working conditions, diversity, and community impact." },
          { name: "Branches", type: "branches", detail: "UN Guiding Principles on Business and Human Rights provides the framework for supply chain human rights due diligence." },
          { name: "Leaves", type: "leaves", detail: "Worker voice technologies (anonymous reporting apps) and blockchain-verified fair trade enable greater transparency." }
        ]},
        { name: "Sustainable Packaging", type: "topic", children: [
          { name: "Roots", type: "roots", detail: "Designing packaging that minimizes environmental impact while protecting products." },
          { name: "Trunk", type: "trunk", detail: "Strategies: reduce material use, use recycled content, design for recyclability, and eliminate single-use plastics." },
          { name: "Branches", type: "branches", detail: "Innovations: mushroom-based packaging, seaweed films, reusable shipping containers, and right-sized packaging algorithms." },
          { name: "Leaves", type: "leaves", detail: "Extended Producer Responsibility (EPR) laws make companies financially responsible for packaging end-of-life management." }
        ]}
      ]
    },
    {
      name: "I — Global Trade & Compliance", type: "section", sectionIndex: 8,
      children: [
        { name: "International Trade", type: "topic", children: [
          { name: "Roots", type: "roots", detail: "The exchange of goods and services across international borders, governed by trade agreements and regulations." },
          { name: "Trunk", type: "trunk", detail: "Key concepts: tariffs, quotas, trade agreements (USMCA, EU Single Market), Incoterms, and letters of credit." },
          { name: "Branches", type: "branches", detail: "Free trade zones, bonded warehouses, and foreign trade zones reduce duty costs for international operations." },
          { name: "Leaves", type: "leaves", detail: "Digital trade facilitation — single window systems and electronic certificates of origin — streamlines cross-border commerce." }
        ]},
        { name: "Customs & Compliance", type: "topic", children: [
          { name: "Roots", type: "roots", detail: "Adhering to import/export laws, customs regulations, and trade compliance requirements." },
          { name: "Trunk", type: "trunk", detail: "Key processes: customs classification (HS codes), valuation, country of origin determination, and duty calculation." },
          { name: "Branches", type: "branches", detail: "Trusted trader programs (C-TPAT, AEO) provide expedited customs clearance for compliant companies." },
          { name: "Leaves", type: "leaves", detail: "Automated broker interfaces and AI-powered classification tools accelerate customs compliance and reduce errors." }
        ]},
        { name: "Trade Finance", type: "topic", children: [
          { name: "Roots", type: "roots", detail: "Financial instruments that facilitate international trade — reducing risk for buyers and sellers." },
          { name: "Trunk", type: "trunk", detail: "Instruments: letters of credit, documentary collections, trade credit insurance, and supply chain finance programs." },
          { name: "Branches", type: "branches", detail: "Supply chain finance (reverse factoring) lets suppliers get early payment using the buyer's stronger credit rating." },
          { name: "Leaves", type: "leaves", detail: "Blockchain-based trade finance platforms digitize letters of credit and reduce processing time from days to hours." }
        ]},
        { name: "Regulatory Compliance", type: "topic", children: [
          { name: "Roots", type: "roots", detail: "Meeting legal and regulatory requirements across all jurisdictions where the supply chain operates." },
          { name: "Trunk", type: "trunk", detail: "Key areas: product safety (FDA, CE marking), environmental (REACH, RoHS), labor, data privacy (GDPR), and anti-corruption (FCPA)." },
          { name: "Branches", type: "branches", detail: "Compliance management systems track regulatory changes, automate reporting, and manage supplier certifications." },
          { name: "Leaves", type: "leaves", detail: "RegTech solutions use AI to monitor regulatory changes across jurisdictions and assess supply chain compliance impact." }
        ]},
        { name: "Sanctions & Export Controls", type: "topic", children: [
          { name: "Roots", type: "roots", detail: "Government restrictions on trade with certain countries, entities, or individuals for national security or foreign policy reasons." },
          { name: "Trunk", type: "trunk", detail: "Key frameworks: OFAC sanctions (US), EU sanctions, denied party screening, and export control classification (EAR, ITAR)." },
          { name: "Branches", type: "branches", detail: "Screening must cover all parties — customers, suppliers, intermediaries, banks, and end-users — across multiple government lists." },
          { name: "Leaves", type: "leaves", detail: "Automated denied party screening tools check transactions in real-time against global watchlists." }
        ]}
      ]
    },
    {
      name: "J — Strategy & Performance", type: "section", sectionIndex: 9,
      children: [
        { name: "Supply Chain Strategy", type: "topic", children: [
          { name: "Roots", type: "roots", detail: "Aligning supply chain design and capabilities with overall business strategy." },
          { name: "Trunk", type: "trunk", detail: "Strategic fit: matching supply chain responsiveness to demand uncertainty. Efficient chains for predictable demand, agile chains for volatile demand." },
          { name: "Branches", type: "branches", detail: "Supply chain segmentation creates different fulfillment paths for different product/customer combinations." },
          { name: "Leaves", type: "leaves", detail: "Dynamic supply chain strategy adjusts in real-time based on market conditions, leveraging digital capabilities." }
        ]},
        { name: "KPIs & Metrics", type: "topic", children: [
          { name: "Roots", type: "roots", detail: "Quantifiable measures used to evaluate supply chain performance against objectives." },
          { name: "Trunk", type: "trunk", detail: "Key metrics: perfect order rate, on-time delivery, inventory turns, cash-to-cash cycle time, and total supply chain cost." },
          { name: "Branches", type: "branches", detail: "Balanced scorecard approach measures financial, customer, process, and learning/growth perspectives." },
          { name: "Leaves", type: "leaves", detail: "Real-time dashboards and control towers provide continuous visibility into KPIs across the end-to-end supply chain." }
        ]},
        { name: "S&OP Process", type: "topic", children: [
          { name: "Roots", type: "roots", detail: "Sales & Operations Planning aligns demand plans with supply capabilities on a monthly cycle." },
          { name: "Trunk", type: "trunk", detail: "Steps: data gathering, demand review, supply review, pre-S&OP meeting, executive S&OP meeting, and plan execution." },
          { name: "Branches", type: "branches", detail: "Integrated Business Planning (IBP) extends S&OP to include financial planning, portfolio management, and strategic alignment." },
          { name: "Leaves", type: "leaves", detail: "AI-driven S&OP automates scenario generation, recommendation engines, and continuous planning cycles." }
        ]},

const nodes = [];
const links = [];
const nodeMap = {};

// Root node
nodes.push({ id: treeData.name, name: treeData.name, type: 'root', data: treeData, sectionIndex: -1 });
nodeMap[treeData.name] = nodes[0];

// Section + topic nodes
treeData.children.forEach(section => {
  const sNode = { id: section.name, name: section.name, type: 'section', data: section, sectionIndex: section.sectionIndex };
  nodes.push(sNode);
  nodeMap[section.name] = sNode;
  links.push({ source: treeData.name, target: section.name, type: 'hierarchy' });

  (section.children || []).forEach(topic => {
    const tNode = { id: topic.name, name: topic.name, type: 'topic', data: topic, sectionIndex: section.sectionIndex };
    nodes.push(tNode);
    nodeMap[topic.name] = tNode;
    links.push({ source: section.name, target: topic.name, type: 'hierarchy' });
  });
});

// Cross-section edges
crossLinks.forEach(cl => {
  if (nodeMap[cl.source] && nodeMap[cl.target]) {
    links.push({ source: cl.source, target: cl.target, type: cl.type, label: cl.label });
  }
});

// Count connections per node
const connectionCount = {};
nodes.forEach(n => connectionCount[n.id] = 0);
links.forEach(l => {
  const sid = typeof l.source === 'string' ? l.source : l.source.id;
  const tid = typeof l.target === 'string' ? l.target : l.target.id;
  if (connectionCount[sid] !== undefined) connectionCount[sid]++;
  if (connectionCount[tid] !== undefined) connectionCount[tid]++;
});

let currentTransform = d3.zoomIdentity;
const zoomBehavior = d3.zoom()
  .scaleExtent([0.1, 3])
  .on('zoom', (event) => {
    currentTransform = event.transform;
    g.attr('transform', event.transform);
    document.getElementById('zoomLevel').textContent = Math.round(event.transform.k * 100) + '%';
    // Toggle labels based on zoom
    nodeGroup.selectAll('.topic-label').style('opacity', event.transform.k > 0.8 ? 1 : 0);
  });

svg.call(zoomBehavior);
svg.on('click', () => { detailPanel.classList.remove('open'); resetHighlight(); });

document.getElementById('zoomIn').addEventListener('click', () => svg.transition().duration(300).call(zoomBehavior.scaleBy, 1.3));
document.getElementById('zoomOut').addEventListener('click', () => svg.transition().duration(300).call(zoomBehavior.scaleBy, 0.7));
document.getElementById('zoomFit').addEventListener('click', fitToScreen);

function fitToScreen() {
  const bounds = g.node().getBBox();
  if (!bounds.width || !bounds.height) return;
  const fullW = container.clientWidth;
  const fullH = container.clientHeight;
  const midX = bounds.x + bounds.width / 2;
  const midY = bounds.y + bounds.height / 2;
  const scale = Math.min(fullW / (bounds.width + 120), fullH / (bounds.height + 120), 1.5);
  const transform = d3.zoomIdentity
    .translate(fullW / 2 - midX * scale, fullH / 2 - midY * scale)
    .scale(scale);
  svg.transition().duration(750).call(zoomBehavior.transform, transform);
}

// ═══════════════════════════════════════════════════════════════
// FORCE SIMULATION
// ═══════════════════════════════════════════════════════════════

const width = container.clientWidth;
const height = container.clientHeight;

// Assign initial positions based on radial clustering
const sectionCount = treeData.children.length;
nodes.forEach(n => {
  if (n.type === 'root') {
    n.fx = width / 2; n.fy = height / 2;
  } else if (n.type === 'section') {
    const angle = (n.sectionIndex / sectionCount) * 2 * Math.PI - Math.PI / 2;
    n.x = width / 2 + Math.cos(angle) * 250;
    n.y = height / 2 + Math.sin(angle) * 250;
  } else {
    const angle = (n.sectionIndex / sectionCount) * 2 * Math.PI - Math.PI / 2;
    const jitter = (Math.random() - 0.5) * 80;
    n.x = width / 2 + Math.cos(angle) * (280 + jitter);
    n.y = height / 2 + Math.sin(angle) * (280 + jitter);
  }
});

const simulation = d3.forceSimulation(nodes)
  .force('link', d3.forceLink(links).id(d => d.id)
    .distance(d => d.type === 'hierarchy' ? 60 : 180)
    .strength(d => d.type === 'hierarchy' ? 0.7 : 0.1)
  )
  .force('charge', d3.forceManyBody()
    .strength(d => d.type === 'root' ? -600 : d.type === 'section' ? -300 : -80)
  )
  .force('center', d3.forceCenter(width / 2, height / 2).strength(0.05))
  .force('collision', d3.forceCollide().radius(d => d.type === 'root' ? 30 : d.type === 'section' ? 22 : 14))
  .force('radial', d3.forceRadial(
    d => d.type === 'root' ? 0 : d.type === 'section' ? 220 : 320,
    width / 2, height / 2
  ).strength(d => d.type === 'root' ? 0 : 0.3))
  .alphaDecay(0.02)
  .on('tick', ticked);

let linkElements = linkGroup.selectAll('line');
let nodeElements = nodeGroup.selectAll('.graph-node');

function render() {
  // Links
  linkElements = linkGroup.selectAll('line').data(links, d => {
    const sid = typeof d.source === 'object' ? d.source.id : d.source;
    const tid = typeof d.target === 'object' ? d.target.id : d.target;
    return sid + '->' + tid;
  });
  linkElements.exit().remove();
  const linkEnter = linkElements.enter().append('line');
  linkElements = linkEnter.merge(linkElements);

  linkElements
    .attr('stroke', d => {
      if (d.type === 'hierarchy') {
        const src = typeof d.source === 'object' ? d.source : nodeMap[d.source];
        return src && src.type === 'root' ? 'var(--link-color)' : sectionColors[src ? src.sectionIndex : 0] || 'var(--link-color)';
      }
      return relationshipTypes[d.type] ? relationshipTypes[d.type].color : '#888';
    })
    .attr('stroke-opacity', d => d.type === 'hierarchy' ? 0.3 : 0.6)
    .attr('stroke-width', d => d.type === 'hierarchy' ? 1 : 1.5)
    .attr('stroke-dasharray', d => {
      if (d.type === 'hierarchy') return '';
      return relationshipTypes[d.type] ? relationshipTypes[d.type].dash : '';
    })
    .attr('marker-end', d => {
      if (d.type === 'hierarchy' || d.type === 'complements') return '';
      return 'url(#arrow-' + d.type + ')';
    })
    .style('pointer-events', 'stroke')
    .style('cursor', 'pointer')
    .on('mouseenter', function(event, d) {
      if (d.type !== 'hierarchy' && d.label) {
        d3.select(this).attr('stroke-width', 3).attr('stroke-opacity', 1);
      }
    })
    .on('mouseleave', function(event, d) {
      d3.select(this).attr('stroke-width', d.type === 'hierarchy' ? 1 : 1.5)
        .attr('stroke-opacity', d.type === 'hierarchy' ? 0.3 : 0.6);
    });

  // Nodes
  nodeElements = nodeGroup.selectAll('.graph-node').data(nodes, d => d.id);
  nodeElements.exit().remove();
  const nodeEnter = nodeElements.enter().append('g').attr('class', 'graph-node').style('cursor', 'pointer');

  nodeEnter.each(function(d) {
    const el = d3.select(this);
    if (d.type === 'root') {
      el.append('circle').attr('r', 24).attr('fill', 'var(--accent)').attr('stroke', '#2a9d6e').attr('stroke-width', 3).style('filter', 'url(#glow)');
    } else if (d.type === 'section') {
      el.append('circle').attr('r', 16).attr('fill', sectionColors[d.sectionIndex]).attr('stroke', 'none').attr('opacity', 0.9);
    } else {
      const r = radiusScale(connectionCount[d.id] || 1);
      el.append('circle').attr('r', r)
        .attr('fill', sectionColors[d.sectionIndex] + '33')
        .attr('stroke', sectionColors[d.sectionIndex])
        .attr('stroke-width', 2);
    }
  });

  // Labels
  nodeEnter.append('text')
    .attr('class', d => d.type === 'topic' ? 'topic-label' : '')
    .attr('dy', d => d.type === 'root' ? -30 : d.type === 'section' ? -22 : -(radiusScale(connectionCount[d.id] || 1) + 6))
    .attr('text-anchor', 'middle')
    .attr('fill', d => d.type === 'root' ? 'var(--accent)' : d.type === 'section' ? sectionColors[d.sectionIndex] : 'var(--text-secondary)')
    .attr('font-family', d => d.type === 'root' ? "'Playfair Display', serif" : "'DM Sans', sans-serif")
    .attr('font-size', d => d.type === 'root' ? '15px' : d.type === 'section' ? '12px' : '10px')
    .attr('font-weight', d => d.type === 'root' || d.type === 'section' ? '700' : '400')
    .style('opacity', d => d.type === 'topic' ? 0 : 1)
    .text(d => d.type === 'section' ? d.name.replace(/^[A-K] — /, '') : d.name);

  nodeElements = nodeEnter.merge(nodeElements);

  // Interactions
  nodeElements
    .on('mouseenter', function(event, d) { event.stopPropagation(); highlightNode(d); })
    .on('mouseleave', function(event, d) { if (!selectedNode) resetHighlight(); })
    .on('click', function(event, d) { event.stopPropagation(); selectNode(d); });

  // Drag
  nodeElements.call(d3.drag()
    .on('start', (event, d) => {
      if (!event.active) simulation.alphaTarget(0.3).restart();
      d.fx = d.x; d.fy = d.y;
    })
    .on('drag', (event, d) => {
      d.fx = event.x; d.fy = event.y;
    })
    .on('end', (event, d) => {
      if (!event.active) simulation.alphaTarget(0);
      if (d.type !== 'root') { d.fx = null; d.fy = null; }
    })
  );
}

function ticked() {
  linkElements
    .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
    .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
  nodeElements.attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');
}

render();

let selectedNode = null;

function getNeighbors(node) {
  const neighbors = new Set([node.id]);
  links.forEach(l => {
    const sid = typeof l.source === 'object' ? l.source.id : l.source;
    const tid = typeof l.target === 'object' ? l.target.id : l.target;
    if (sid === node.id) neighbors.add(tid);
    if (tid === node.id) neighbors.add(sid);
  });
  return neighbors;
}

function highlightNode(node) {
  const neighbors = getNeighbors(node);
  nodeElements.style('opacity', d => neighbors.has(d.id) ? 1 : 0.15);
  linkElements.style('opacity', d => {
    const sid = d.source.id || d.source;
    const tid = d.target.id || d.target;
    return (sid === node.id || tid === node.id) ? 1 : 0.05;
  });
  linkElements.filter(d => {
    const sid = d.source.id || d.source;
    const tid = d.target.id || d.target;
    return sid === node.id || tid === node.id;
  }).attr('stroke-width', d => d.type === 'hierarchy' ? 1.5 : 3);
  // Show topic labels for neighbors
  nodeElements.selectAll('.topic-label').style('opacity', d => neighbors.has(d.id) ? 1 : 0);
}

function resetHighlight() {
  nodeElements.style('opacity', 1);
  linkElements.style('opacity', d => d.type === 'hierarchy' ? 0.3 : 0.6)
    .attr('stroke-width', d => d.type === 'hierarchy' ? 1 : 1.5);
  nodeElements.selectAll('.topic-label').style('opacity', currentTransform.k > 0.8 ? 1 : 0);
}

function selectNode(node) {
  selectedNode = node;
  highlightNode(node);
  showDetail(node);
}

const detailPanel = document.getElementById('detailPanel');

function showDetail(node) {
  detailPanel.classList.add('open');

  // Breadcrumb
  while (detailBreadcrumb.firstChild) detailBreadcrumb.removeChild(detailBreadcrumb.firstChild);
  const breadcrumbs = [];
  if (node.type === 'topic') {
    breadcrumbs.push(treeData.name);
    const sec = treeData.children[node.sectionIndex];
    if (sec) breadcrumbs.push(sec.name);
    breadcrumbs.push(node.name);
  } else if (node.type === 'section') {
    breadcrumbs.push(treeData.name);
    breadcrumbs.push(node.name);
  } else {
    breadcrumbs.push(node.name);
  }
  breadcrumbs.forEach((name, idx) => {
    const span = document.createElement('span');
    if (idx === breadcrumbs.length - 1) span.className = 'current';
    span.textContent = name.length > 25 ? name.substring(0, 25) + '...' : name;
    detailBreadcrumb.appendChild(span);
    if (idx < breadcrumbs.length - 1) {
      const sep = document.createElement('span');
      sep.className = 'sep'; sep.textContent = '\u203a';
      detailBreadcrumb.appendChild(sep);
    }
  });

  // Type badge
  const tc = node.type === 'root' ? '#4fd1a0' : sectionColors[node.sectionIndex] || '#888';
  detailType.style.background = tc + '22';
  detailType.style.color = tc;
  detailType.textContent = node.type.charAt(0).toUpperCase() + node.type.slice(1);

  // Title
  detailTitle.textContent = node.name;

  // Body
  while (detailBody.firstChild) detailBody.removeChild(detailBody.firstChild);

  if (node.data.detail) {
    const p = document.createElement('p');
    p.textContent = node.data.detail;
    detailBody.appendChild(p);
  }

  // Show depth levels for topics
  if (node.data.children && node.data.children.length > 0) {
    const childDiv = document.createElement('div');
    childDiv.className = 'detail-children';
    const h4 = document.createElement('h4');
    h4.textContent = 'Knowledge Levels';
    childDiv.appendChild(h4);

    const typeColors = { roots: '#8B6914', trunk: '#6B4226', branches: '#2d8a4e', leaves: '#48c774' };
    node.data.children.forEach(c => {
      const item = document.createElement('div');
      item.className = 'detail-child-item';
      const typeLabel = document.createElement('div');
      typeLabel.className = 'child-type';
      typeLabel.style.color = typeColors[c.type] || '#888';
      typeLabel.textContent = c.type;
      item.appendChild(typeLabel);
      if (c.detail) {
        const preview = document.createElement('div');
        preview.className = 'child-preview';
        preview.textContent = c.detail;
        preview.style.color = 'var(--text-secondary)';
        preview.style.fontSize = '12px';
        item.appendChild(preview);
      }
      childDiv.appendChild(item);
    });
    detailBody.appendChild(childDiv);
  }

  // Show section children for section nodes
  if (node.type === 'section' && node.data.children) {
    const childDiv = document.createElement('div');
    childDiv.className = 'detail-children';
    const h4 = document.createElement('h4');
    h4.textContent = 'Topics';
    childDiv.appendChild(h4);
    node.data.children.forEach(c => {
      const item = document.createElement('div');
      item.className = 'detail-child-item';
      item.textContent = c.name;
      item.addEventListener('click', () => {
        const target = nodes.find(n => n.id === c.name);
        if (target) selectNode(target);
      });
      childDiv.appendChild(item);
    });
    detailBody.appendChild(childDiv);
  }

  // Connected topics (cross-links)
  const connections = {};
  crossLinks.forEach(cl => {
    if (cl.source === node.id || cl.target === node.id) {
      if (!connections[cl.type]) connections[cl.type] = [];
      connections[cl.type].push(cl);
    }
  });

  if (Object.keys(connections).length > 0) {
    const connDiv = document.createElement('div');
    connDiv.className = 'detail-children';
    const h4 = document.createElement('h4');
    h4.textContent = 'Connected Topics';
    connDiv.appendChild(h4);

    Object.entries(connections).forEach(([type, conns]) => {
      const group = document.createElement('div');
      group.className = 'connection-group';
      const h5 = document.createElement('h5');
      const dot = document.createElement('span');
      dot.className = 'conn-dot';
      dot.style.background = relationshipTypes[type].color;
      h5.appendChild(dot);
      h5.appendChild(document.createTextNode(relationshipTypes[type].label));
      group.appendChild(h5);

      conns.forEach(conn => {
        const other = conn.source === node.id ? conn.target : conn.source;
        const item = document.createElement('div');
        item.className = 'connection-item';
        item.textContent = other;
        if (conn.label) {
          const lbl = document.createElement('div');
          lbl.className = 'conn-label';
          lbl.textContent = conn.label;
          item.appendChild(lbl);
        }
        item.addEventListener('click', () => {
          const target = nodes.find(n => n.id === other);
          if (target) selectNode(target);
        });
        group.appendChild(item);
      });
      connDiv.appendChild(group);
    });
    detailBody.appendChild(connDiv);
  }
}

const searchInput = document.getElementById('searchInput');
const searchClear = document.getElementById('searchClear');
const searchCount = document.getElementById('searchCount');

searchInput.addEventListener('input', debounce(handleSearch, 200));
searchClear.addEventListener('click', () => {
  searchInput.value = '';
  searchClear.classList.remove('visible');
  searchCount.textContent = '';
  resetHighlight();
});

function handleSearch() {
  const query = searchInput.value.trim().toLowerCase();
  searchClear.classList.toggle('visible', query.length > 0);

  if (query.length < 2) {
    searchCount.textContent = '';
    resetHighlight();
    return;
  }

  const matches = new Set();
  const matchNeighbors = new Set();
  nodes.forEach(n => {
    const nameMatch = n.name.toLowerCase().includes(query);
    const detailMatch = n.data.detail && n.data.detail.toLowerCase().includes(query);
    const childMatch = n.data.children && n.data.children.some(c => c.detail && c.detail.toLowerCase().includes(query));
    if (nameMatch || detailMatch || childMatch) {
      matches.add(n.id);
      getNeighbors(n).forEach(id => matchNeighbors.add(id));
    }
  });

  searchCount.textContent = matches.size + ' match' + (matches.size !== 1 ? 'es' : '');

  nodeElements.style('opacity', d => matches.has(d.id) ? 1 : matchNeighbors.has(d.id) ? 0.5 : 0.15);
  nodeElements.selectAll('circle').style('filter', d => matches.has(d.id) ? 'url(#glow)' : 'none');
  nodeElements.selectAll('.topic-label').style('opacity', d => matches.has(d.id) ? 1 : 0);
  linkElements.style('opacity', 0.05);
}

function debounce(fn, ms) {
  let timer;
  return function() {
    const args = arguments, ctx = this;
    clearTimeout(timer);
    timer = setTimeout(() => fn.apply(ctx, args), ms);
  };
}
