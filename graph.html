// ═══════════════════════════════════════════════════════════════
// QUESTION GENERATION ENGINE
// ═══════════════════════════════════════════════════════════════

function getAllTopics(sectionIndices) {
  const topics = [];
  treeData.children.forEach(section => {
    if (sectionIndices.includes(section.sectionIndex)) {
      (section.children || []).forEach(topic => {
        topics.push({ ...topic, sectionIndex: section.sectionIndex, sectionName: section.name });
      });
    }
  });
  return topics;
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickDistractors(correct, pool, count) {
  const sameSection = pool.filter(t => t.sectionIndex === correct.sectionIndex && t.name !== correct.name);
  const otherSection = pool.filter(t => t.sectionIndex !== correct.sectionIndex && t.name !== correct.name);
  const ordered = shuffle(sameSection).concat(shuffle(otherSection));
  return ordered.slice(0, count);
}

function getDepthDetail(topic, depthType) {
  const child = (topic.children || []).find(c => c.type === depthType);
  return child ? child.detail : null;
}

function generateQuestions(sections, difficulty, count) {
  const topics = getAllTopics(sections);
  const allTopics = getAllTopics(Array.from({length: 11}, (_, i) => i));
  if (topics.length < 4) return [];

  const sectionNames = treeData.children.filter(s => sections.includes(s.sectionIndex));
  const relevantCrossLinks = crossLinks.filter(cl => {
    const srcNode = nodeMap[cl.source];
    const tgtNode = nodeMap[cl.target];
    return srcNode && tgtNode && (sections.includes(srcNode.sectionIndex) || sections.includes(tgtNode.sectionIndex));
  });

  const questions = [];
  let idCounter = 0;

  function addQ(type, diff, sIdx, question, options, correctIdx, explanation, highlightNodes, highlightEdge) {
    questions.push({ id: idCounter++, type, difficulty: diff, sectionIndex: sIdx, question, options, correctIndex: correctIdx, explanation, highlightNodes: highlightNodes || [], highlightEdge: highlightEdge || null });
  }

  // Type 1: Topic from Description (Easy)
  if (difficulty === 'easy' || difficulty === 'mixed') {
    topics.forEach(topic => {
      const rootsDetail = getDepthDetail(topic, 'roots');
      if (!rootsDetail) return;
      const distractors = pickDistractors(topic, topics, 3);
      if (distractors.length < 3) return;
      const options = shuffle([topic, ...distractors]);
      addQ(1, 'easy', topic.sectionIndex,
        'Which topic is described as: "' + rootsDetail + '"',
        options.map(o => o.name), options.indexOf(topic),
        'This describes "' + topic.name + '" at the Roots level.', [topic.name]);
    });
  }

  // Type 2: Section Membership (Easy)
  if (difficulty === 'easy' || difficulty === 'mixed') {
    topics.forEach(topic => {
      if (sectionNames.length < 4) return;
      const correctSection = sectionNames.find(s => s.sectionIndex === topic.sectionIndex);
      if (!correctSection) return;
      const otherSections = shuffle(sectionNames.filter(s => s.sectionIndex !== topic.sectionIndex)).slice(0, 3);
      if (otherSections.length < 3) return;
      const options = shuffle([correctSection, ...otherSections]);
      addQ(2, 'easy', topic.sectionIndex,
        'Which section does "' + topic.name + '" belong to?',
        options.map(o => o.name.replace(/^[A-K] — /, '')), options.indexOf(correctSection),
        '"' + topic.name + '" belongs to ' + correctSection.name + '.', [topic.name, correctSection.name]);
    });
  }

  // Type 3: Depth Level ID (Medium)
  if (difficulty === 'medium' || difficulty === 'mixed') {
    const depthTypes = ['roots', 'trunk', 'branches', 'leaves'];
    const depthLabels = { roots: 'Roots (foundational)', trunk: 'Trunk (core concepts)', branches: 'Branches (applications)', leaves: 'Leaves (advanced/cutting-edge)' };
    topics.forEach(topic => {
      const chosen = depthTypes[Math.floor(Math.random() * depthTypes.length)];
      const detail = getDepthDetail(topic, chosen);
      if (!detail) return;
      const options = shuffle(depthTypes);
      const snippet = detail.length > 120 ? detail.substring(0, 120) + '...' : detail;
      addQ(3, 'medium', topic.sectionIndex,
        'For "' + topic.name + '", what depth level is this?\n"' + snippet + '"',
        options.map(o => depthLabels[o]), options.indexOf(chosen),
        'This is the ' + depthLabels[chosen] + ' level for "' + topic.name + '".', [topic.name]);
    });
  }

  // Type 4: Relationship Type (Medium)
  if (difficulty === 'medium' || difficulty === 'mixed') {
    relevantCrossLinks.forEach(cl => {
      const relTypes = Object.entries(relationshipTypes);
      const correctType = relTypes.find(([k]) => k === cl.type);
      if (!correctType) return;
      const otherTypes = shuffle(relTypes.filter(([k]) => k !== cl.type)).slice(0, 3);
      if (otherTypes.length < 3) return;
      const options = shuffle([correctType, ...otherTypes]);
      addQ(4, 'medium', nodeMap[cl.source] ? nodeMap[cl.source].sectionIndex : 0,
        'What type of relationship connects "' + cl.source + '" to "' + cl.target + '"?',
        options.map(o => o[1].label), options.indexOf(correctType),
        cl.label + '. This is a "' + correctType[1].label + '" relationship.',
        [cl.source, cl.target], { source: cl.source, target: cl.target });
    });
  }

  // Type 5: Cross-Link Partner (Medium)
  if (difficulty === 'medium' || difficulty === 'mixed') {
    relevantCrossLinks.forEach(cl => {
      const targetNode = nodeMap[cl.target];
      if (!targetNode) return;
      const distractors = shuffle(allTopics.filter(t => t.name !== cl.target && t.name !== cl.source)).slice(0, 3);
      if (distractors.length < 3) return;
      const targetTopic = allTopics.find(t => t.name === cl.target) || { name: cl.target };
      const options = shuffle([targetTopic, ...distractors]);
      const relLabel = relationshipTypes[cl.type] ? relationshipTypes[cl.type].label.toLowerCase() : 'relates to';
      addQ(5, 'medium', nodeMap[cl.source] ? nodeMap[cl.source].sectionIndex : 0,
        '"' + cl.source + '" ' + relLabel + ' which topic?',
        options.map(o => o.name), options.indexOf(targetTopic),
        cl.label + '.', [cl.source, cl.target], { source: cl.source, target: cl.target });
    });
  }

  // Type 6: Expert Detail Match (Hard)
  if (difficulty === 'hard' || difficulty === 'mixed') {
    topics.forEach(topic => {
      const leavesDetail = getDepthDetail(topic, 'leaves');
      if (!leavesDetail) return;
      const distractors = pickDistractors(topic, allTopics, 3);
      if (distractors.length < 3) return;
      const options = shuffle([topic, ...distractors]);
      const snippet = leavesDetail.length > 140 ? leavesDetail.substring(0, 140) + '...' : leavesDetail;
      addQ(6, 'hard', topic.sectionIndex,
        'Which topic has this advanced detail?\n"' + snippet + '"',
        options.map(o => o.name), options.indexOf(topic),
        'This is the Leaves-level detail for "' + topic.name + '".', [topic.name]);
    });
  }

  // Type 7: Path Reasoning (Hard)
  if (difficulty === 'hard' || difficulty === 'mixed') {
    relevantCrossLinks.forEach(cl1 => {
      crossLinks.forEach(cl2 => {
        if (cl1.target === cl2.source && cl1.source !== cl2.target) {
          const mid = cl1.target;
          const midTopic = allTopics.find(t => t.name === mid);
          if (!midTopic) return;
          const distractors = shuffle(allTopics.filter(t => t.name !== mid && t.name !== cl1.source && t.name !== cl2.target)).slice(0, 3);
          if (distractors.length < 3) return;
          const options = shuffle([midTopic, ...distractors]);
          addQ(7, 'hard', midTopic.sectionIndex,
            'What intermediate topic connects "' + cl1.source + '" to "' + cl2.target + '"?',
            options.map(o => o.name), options.indexOf(midTopic),
            '"' + cl1.source + '" \u2192 "' + mid + '" \u2192 "' + cl2.target + '". ' + cl1.label + '; then ' + cl2.label + '.',
            [cl1.source, mid, cl2.target], { source: cl1.source, target: mid });
        }
      });
    });
  }

  const filtered = difficulty === 'mixed' ? questions : questions.filter(q => q.difficulty === difficulty);
  const selected = shuffle(filtered).slice(0, count);
  const seen = new Set();
  const unique = [];
  for (const q of selected) {
    if (!seen.has(q.question)) { seen.add(q.question); unique.push(q); }
    if (unique.length >= count) break;
  }
  return unique;
}

// QUIZ FLOW
// ═══════════════════════════════════════════════════════════════

function startQuiz() {
  const qs = generateQuestions(quizState.selectedSections, quizState.difficulty, quizState.questionCount);
  if (qs.length === 0) {
    alert('Not enough data to generate questions. Try selecting more sections.');
    return;
  }
  quizState.questions = qs;
  quizState.currentIndex = 0;
  quizState.answers = [];
  quizState.score = 0;
  quizState.streak = 0;
  quizState.bestStreak = 0;
  quizState.startTime = Date.now();
  quizState.endTime = null;
  quizState.sectionScores = {};
  quizState.screen = 'quiz';
  quizState.reviewMode = false;
  showQuizScreen('quizActive');
  showQuestion(0);
}

function showQuestion(index) {
  clearQuizTimer();
  clearQuizNodeStyles();
  const q = quizState.questions[index];
  if (!q) return;

  document.getElementById('quizProgressFill').style.width = ((index / quizState.questions.length) * 100) + '%';
  document.getElementById('quizScoreDisplay').textContent = quizState.score + '/' + quizState.answers.length;
  updateStreakDisplay();
  document.getElementById('quizQNumText').textContent = 'Question ' + (index + 1) + ' of ' + quizState.questions.length;
  document.getElementById('quizQuestionText').textContent = q.question;

  const optionsEl = document.getElementById('quizOptions');
  clearEl(optionsEl);
  const keys = ['1', '2', '3', '4'];
  q.options.forEach((opt, i) => {
    const div = document.createElement('div');
    div.className = 'quiz-option';
    div.dataset.index = i;
    const key = document.createElement('span');
    key.className = 'opt-key';
    key.textContent = keys[i];
    const txt = document.createElement('span');
    txt.textContent = opt;
    div.appendChild(key); div.appendChild(txt);
    div.addEventListener('click', () => submitAnswer(i));
    optionsEl.appendChild(div);
  });

  document.getElementById('quizExplanation').classList.remove('visible');
  document.getElementById('quizViewGraph').classList.remove('visible');
  document.getElementById('quizNextBtn').disabled = true;

  highlightQuizNodes(q.highlightNodes);
  if (q.highlightNodes.length > 0) zoomToNodes(q.highlightNodes);

  if (quizState.timedMode && !quizState.reviewMode) startQuizTimer();
}

function submitAnswer(optionIndex) {
  const q = quizState.questions[quizState.currentIndex];
  if (!q) return;
  const optionEls = document.querySelectorAll('#quizOptions .quiz-option');
  if (optionEls[0] && optionEls[0].classList.contains('locked')) return;

  clearQuizTimer();
  const isCorrect = optionIndex === q.correctIndex;
  quizState.answers.push({ questionIndex: quizState.currentIndex, selected: optionIndex, correct: isCorrect });

  if (isCorrect) {
    quizState.score++;
    quizState.streak++;
    if (quizState.streak > quizState.bestStreak) quizState.bestStreak = quizState.streak;
    checkStreak();
  } else {
    quizState.streak = 0;
  }

  const secIdx = q.sectionIndex;
  if (!quizState.sectionScores[secIdx]) quizState.sectionScores[secIdx] = { correct: 0, total: 0 };
  quizState.sectionScores[secIdx].total++;
  if (isCorrect) quizState.sectionScores[secIdx].correct++;

  // Update mastery
  const mastery = loadMastery();
  q.highlightNodes.forEach(name => {
    const topicNode = nodes.find(n => n.id === name && n.type === 'topic');
    if (!topicNode) return;
    if (!mastery[name]) mastery[name] = { attempts: 0, correct: 0, lastDate: null };
    mastery[name].attempts++;
    if (isCorrect) mastery[name].correct++;
    mastery[name].lastDate = new Date().toISOString();
  });
  saveMastery(mastery);
  document.getElementById('btnMastery').style.display = '';

  // Visual feedback on options
  optionEls.forEach((el, i) => {
    el.classList.add('locked');
    if (i === optionIndex && !isCorrect) el.classList.add('wrong');
    if (i === q.correctIndex) el.classList.add('correct');
  });

  // Graph feedback
  if (isCorrect) {
    highlightQuizNodesCorrect(q.highlightNodes);
    if (q.highlightEdge) highlightQuizEdge(q.highlightEdge.source, q.highlightEdge.target);
  } else {
    highlightQuizNodesWrong(q.highlightNodes);
    setTimeout(() => highlightQuizNodesCorrect(q.highlightNodes), 600);
  }

  // Explanation (safe DOM)
  const explEl = document.getElementById('quizExplanation');
  clearEl(explEl);
  explEl.appendChild(makeStrong(isCorrect ? '\u2713 Correct! ' : '\u2717 Incorrect. '));
  explEl.appendChild(document.createTextNode(q.explanation));
  explEl.classList.add('visible');

  if (q.highlightNodes.length > 0) document.getElementById('quizViewGraph').classList.add('visible');

  document.getElementById('quizScoreDisplay').textContent = quizState.score + '/' + quizState.answers.length;
  updateStreakDisplay();
  document.getElementById('quizNextBtn').disabled = false;

  if (quizState.currentIndex === quizState.questions.length - 1) {
    document.getElementById('quizNextBtn').textContent = 'See Results';
  }
}

function nextQuestion() {
  if (quizState.currentIndex >= quizState.questions.length - 1) { endQuiz(); return; }
  quizState.currentIndex++;
  showQuestion(quizState.currentIndex);
}

document.getElementById('quizNextBtn').addEventListener('click', nextQuestion);
document.getElementById('quizQuitBtn').addEventListener('click', exitQuizMode);
document.getElementById('quizViewGraph').addEventListener('click', () => {
  const q = quizState.questions[quizState.currentIndex];
  if (q && q.highlightNodes.length > 0) {
    zoomToNodes(q.highlightNodes);
    highlightQuizNodes(q.highlightNodes);
    if (q.highlightEdge) highlightQuizEdge(q.highlightEdge.source, q.highlightEdge.target);
  }
});

// TIMER
// ═══════════════════════════════════════════════════════════════

function startQuizTimer() {
  const ring = document.getElementById('quizTimerRing');
  const fg = document.getElementById('quizTimerFg');
  const txt = document.getElementById('quizTimerText');
  ring.style.display = '';
  quizState.timerSeconds = 30;
  txt.textContent = '30';
  fg.classList.remove('urgent');
  fg.setAttribute('stroke-dashoffset', '0');
  const circumference = 94.25;
  quizState.timerInterval = setInterval(() => {
    quizState.timerSeconds--;
    txt.textContent = quizState.timerSeconds;
    fg.setAttribute('stroke-dashoffset', circumference * (1 - quizState.timerSeconds / 30));
    if (quizState.timerSeconds <= 10) fg.classList.add('urgent');
    if (quizState.timerSeconds <= 0) { clearQuizTimer(); submitAnswer(-1); }
  }, 1000);
}

function clearQuizTimer() {
  if (quizState.timerInterval) { clearInterval(quizState.timerInterval); quizState.timerInterval = null; }
  document.getElementById('quizTimerRing').style.display = 'none';
}

// ═══════════════════════════════════════════════════════════════
// STREAK SYSTEM
// ═══════════════════════════════════════════════════════════════

function updateStreakDisplay() {
  const el = document.getElementById('quizStreakDisplay');
  if (quizState.streak >= 7) {
    el.textContent = '\uD83D\uDD25\u00D7' + quizState.streak + ' LEGENDARY';
    el.className = 'quiz-streak-display on-fire';
  } else if (quizState.streak >= 5) {
    el.textContent = '\uD83D\uDD25 On Fire! \u00D7' + quizState.streak;
    el.className = 'quiz-streak-display on-fire';
  } else if (quizState.streak >= 3) {
    el.textContent = '\u26A1 \u00D7' + quizState.streak;
    el.className = 'quiz-streak-display';
  } else if (quizState.streak > 0) {
    el.textContent = '\u00D7' + quizState.streak;
    el.className = 'quiz-streak-display';
  } else {
    el.textContent = '';
    el.className = 'quiz-streak-display';
  }
}

function checkStreak() {
  if (quizState.streak === 3) showToast('Nice! 3 in a row!', 'nice');
  else if (quizState.streak === 5) showToast('On Fire!', 'fire');
  else if (quizState.streak === 7) showToast('LEGENDARY! \u00D77 Streak!', 'legendary');
  else if (quizState.streak > 7 && quizState.streak % 3 === 0) showToast('UNSTOPPABLE \u00D7' + quizState.streak, 'legendary');
}

function showToast(text, cls) {
  const toast = document.getElementById('quizToast');
  toast.textContent = text;
  toast.className = 'quiz-toast ' + cls + ' show';
  setTimeout(() => toast.classList.remove('show'), 2000);
}

// ═══════════════════════════════════════════════════════════════
// GRAPH INTEGRATION
// ═══════════════════════════════════════════════════════════════

function highlightQuizNodes(nodeIds) {
  if (!nodeIds || nodeIds.length === 0) return;
  const idSet = new Set(nodeIds);
  nodeElements.style('opacity', d => idSet.has(d.id) ? 1 : 0.15);
  nodeElements.classed('quiz-highlight-node', d => idSet.has(d.id));
  nodeElements.selectAll('.topic-label').style('opacity', d => idSet.has(d.id) ? 1 : 0);
  linkElements.style('opacity', 0.05);
}

function highlightQuizNodesCorrect(nodeIds) {
  const idSet = new Set(nodeIds);
  nodeElements.filter(d => idSet.has(d.id)).selectAll('circle')
    .transition().duration(300).attr('stroke', '#4caf7a').attr('stroke-width', 4).style('filter', 'url(#glow)');
}

function highlightQuizNodesWrong(nodeIds) {
  const idSet = new Set(nodeIds);
  nodeElements.filter(d => idSet.has(d.id)).selectAll('circle')
    .transition().duration(300).attr('stroke', '#e15759').attr('stroke-width', 4);
}

function highlightQuizEdge(source, target) {
  linkElements.filter(d => {
    const sid = d.source.id || d.source;
    const tid = d.target.id || d.target;
    return (sid === source && tid === target) || (sid === target && tid === source);
  }).classed('quiz-edge-active', true).style('opacity', 1).attr('stroke-width', 4).attr('stroke-dasharray', '8,4');
}

function animatePathDot(source, target) {
  const srcNode = nodes.find(n => n.id === source);
  const tgtNode = nodes.find(n => n.id === target);
  if (!srcNode || !tgtNode) return;
  const dot = g.append('circle').attr('r', 4).attr('fill', 'var(--accent)')
    .attr('cx', srcNode.x).attr('cy', srcNode.y).style('filter', 'url(#glow)');
  dot.transition().duration(1500).ease(d3.easeCubicInOut)
    .attr('cx', tgtNode.x).attr('cy', tgtNode.y)
    .on('end', () => dot.transition().duration(500).style('opacity', 0).remove());
}

function clearQuizNodeStyles() {
  nodeElements.classed('quiz-highlight-node', false);
  nodeElements.selectAll('circle').each(function(d) {
    const el = d3.select(this);
    if (d.type === 'root') {
      el.attr('stroke', '#2a9d6e').attr('stroke-width', 3).style('filter', 'url(#glow)');
    } else if (d.type === 'section') {
      el.attr('stroke', 'none').attr('stroke-width', 0).style('filter', 'none');
    } else {
      el.attr('stroke', sectionColors[d.sectionIndex]).attr('stroke-width', 2).style('filter', 'none');
    }
  });
  linkElements.classed('quiz-edge-active', false).attr('stroke-dasharray', d => {
    if (d.type === 'hierarchy') return '';
    return relationshipTypes[d.type] ? relationshipTypes[d.type].dash : '';
  });
  resetHighlight();
}

function zoomToNodes(nodeIds) {
  const targetNodes = nodes.filter(n => nodeIds.includes(n.id));
  if (targetNodes.length === 0) return;
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  targetNodes.forEach(n => {
    if (n.x < minX) minX = n.x;
    if (n.x > maxX) maxX = n.x;
    if (n.y < minY) minY = n.y;
    if (n.y > maxY) maxY = n.y;
  });
  const padding = 100;
  const midX = (minX + maxX) / 2, midY = (minY + maxY) / 2;
  const bw = (maxX - minX) + padding * 2, bh = (maxY - minY) + padding * 2;
  const cw = container.clientWidth, ch = container.clientHeight;
  const scale = Math.min(cw / bw, ch / bh, 2);
  const transform = d3.zoomIdentity.translate(cw / 2 - midX * scale, ch / 2 - midY * scale).scale(scale);
  svg.transition().duration(600).call(zoomBehavior.transform, transform);
}

// Guard: prevent detail panel during quiz
const originalSelectNode = selectNode;
selectNode = function(node) {
  if (quizState.active && quizState.screen === 'quiz') return;
  originalSelectNode(node);
};

// ═══════════════════════════════════════════════════════════════
// RESULTS SCREEN
// ═══════════════════════════════════════════════════════════════

function endQuiz() {
  clearQuizTimer();
  quizState.endTime = Date.now();
  quizState.screen = 'results';
  showQuizScreen('quizResults');

  const total = quizState.questions.length;
  const pct = Math.round((quizState.score / total) * 100);

  // Save history
  const history = loadHistory();
  history.push({ date: new Date().toISOString(), score: quizState.score, total, difficulty: quizState.difficulty, timeMs: quizState.endTime - quizState.startTime });
  saveHistory(history);

  // Score ring animation
  const ring = document.getElementById('quizRingFg');
  const circumference = 283;
  const offset = circumference * (1 - pct / 100);
  const gradeColor = pct >= 90 ? '#4caf7a' : pct >= 70 ? '#f28e2b' : '#e15759';
  ring.style.stroke = gradeColor;
  ring.style.strokeDashoffset = circumference;
  setTimeout(() => { ring.style.strokeDashoffset = offset; }, 100);

  // Score count-up
  const scoreBig = document.getElementById('quizScoreBig');
  let displayPct = 0;
  const countInterval = setInterval(() => {
    displayPct += Math.max(1, Math.floor(pct / 30));
    if (displayPct >= pct) { displayPct = pct; clearInterval(countInterval); }
    clearEl(scoreBig);
    scoreBig.appendChild(document.createTextNode(displayPct));
    const span = document.createElement('span');
    span.className = 'quiz-score-pct';
    span.textContent = '%';
    scoreBig.appendChild(span);
  }, 40);

  // Grade
  const gradeEl = document.getElementById('quizGrade');
  let grade, gradeBg;
  if (pct >= 97) { grade = 'A+'; gradeBg = '#4caf7a'; }
  else if (pct >= 93) { grade = 'A'; gradeBg = '#4caf7a'; }
  else if (pct >= 90) { grade = 'A-'; gradeBg = '#4caf7a'; }
  else if (pct >= 80) { grade = 'B'; gradeBg = '#76b7b2'; }
  else if (pct >= 70) { grade = 'C'; gradeBg = '#f28e2b'; }
  else if (pct >= 60) { grade = 'D'; gradeBg = '#e15759'; }
  else { grade = 'F'; gradeBg = '#e15759'; }
  gradeEl.textContent = grade;
  gradeEl.style.background = gradeBg + '22';
  gradeEl.style.color = gradeBg;

  // Stats
  document.getElementById('quizStatStreak').textContent = quizState.bestStreak;
  const timeS = Math.round((quizState.endTime - quizState.startTime) / 1000);
  document.getElementById('quizStatTime').textContent = timeS >= 60 ? Math.floor(timeS / 60) + 'm ' + (timeS % 60) + 's' : timeS + 's';
  document.getElementById('quizStatDiff').textContent = quizState.difficulty.charAt(0).toUpperCase() + quizState.difficulty.slice(1);

  // Section breakdown (safe DOM)
  const breakdownEl = document.getElementById('quizBreakdown');
  clearEl(breakdownEl);
  const breakdownH3 = document.createElement('h3');
  breakdownH3.textContent = 'Section Breakdown';
  breakdownEl.appendChild(breakdownH3);

  Object.entries(quizState.sectionScores).forEach(([secIdx, data]) => {
    const sec = treeData.children[secIdx];
    if (!sec) return;
    const item = document.createElement('div');
    item.className = 'quiz-breakdown-item';
    const dot = document.createElement('span');
    dot.className = 'quiz-breakdown-dot';
    dot.style.background = sectionColors[secIdx];
    const name = document.createElement('span');
    name.className = 'quiz-breakdown-name';
    name.textContent = sec.name.replace(/^[A-K] — /, '');
    const bar = document.createElement('div');
    bar.className = 'quiz-breakdown-bar';
    const fill = document.createElement('div');
    fill.className = 'quiz-breakdown-fill';
    fill.style.background = sectionColors[secIdx];
    setTimeout(() => { fill.style.width = Math.round((data.correct / data.total) * 100) + '%'; }, 200);
    bar.appendChild(fill);
    const score = document.createElement('span');
    score.className = 'quiz-breakdown-score';
    score.textContent = data.correct + '/' + data.total;
    item.appendChild(dot); item.appendChild(name); item.appendChild(bar); item.appendChild(score);
    breakdownEl.appendChild(item);
  });

  renderSparkline();
  document.getElementById('quizProgressFill').style.width = '100%';
  if (pct === 100) triggerConfetti();
}

function renderSparkline() {
  const history = loadHistory();
  const wrap = document.getElementById('quizSparkWrap');
  const svgEl = document.getElementById('quizSparkline');
  clearEl(svgEl);
  if (history.length < 2) { wrap.style.display = 'none'; return; }
  wrap.style.display = '';

  const w = 260, h = 40, pad = 4;
  const scores = history.map(r => Math.round((r.score / r.total) * 100));
  const min = Math.min(...scores) - 5, max = Math.max(...scores) + 5;
  const xScale = (i) => pad + (i / (scores.length - 1)) * (w - pad * 2);
  const yScale = (v) => h - pad - ((v - min) / (max - min)) * (h - pad * 2);

  const points = scores.map((v, i) => xScale(i) + ',' + yScale(v)).join(' ');
  const areaPoints = points + ' ' + xScale(scores.length - 1) + ',' + (h - pad) + ' ' + xScale(0) + ',' + (h - pad);

  const area = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
  area.setAttribute('class', 'spark-area');
  area.setAttribute('points', areaPoints);
  svgEl.appendChild(area);

  const line = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
  line.setAttribute('points', points);
  svgEl.appendChild(line);

  const lastDot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  lastDot.setAttribute('cx', xScale(scores.length - 1));
  lastDot.setAttribute('cy', yScale(scores[scores.length - 1]));
  lastDot.setAttribute('r', '3');
  svgEl.appendChild(lastDot);
}

// ═══════════════════════════════════════════════════════════════
// CONFETTI
// ═══════════════════════════════════════════════════════════════

function triggerConfetti() {
  const colors = ['#4caf7a','#f28e2b','#e15759','#76b7b2','#edc948','#b07aa1','#4e79a7'];
  for (let i = 0; i < 60; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + 'vw';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDelay = Math.random() * 1.5 + 's';
    piece.style.animationDuration = (2 + Math.random() * 2) + 's';
    piece.style.width = (5 + Math.random() * 8) + 'px';
    piece.style.height = (5 + Math.random() * 8) + 'px';
    piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    document.body.appendChild(piece);
    setTimeout(() => piece.remove(), 4000);
  }
}

// ═══════════════════════════════════════════════════════════════
// RESULTS ACTIONS
// ═══════════════════════════════════════════════════════════════

document.getElementById('quizReviewBtn').addEventListener('click', () => {
  const missed = quizState.answers.filter(a => !a.correct);
  if (missed.length === 0) { showToast('No missed questions!', 'nice'); return; }
  quizState.reviewMode = true;
  quizState.reviewIndex = 0;
  quizState.screen = 'quiz';
  showQuizScreen('quizActive');
  document.getElementById('quizQuitBtn').style.display = 'none';
  reviewMissed(missed);
});

function reviewMissed(missed) {
  if (quizState.reviewIndex >= missed.length) {
    quizState.reviewMode = false;
    quizState.screen = 'results';
    showQuizScreen('quizResults');
    document.getElementById('quizQuitBtn').style.display = '';
    return;
  }
  const answer = missed[quizState.reviewIndex];
  const q = quizState.questions[answer.questionIndex];
  quizState.currentIndex = answer.questionIndex;

  document.getElementById('quizProgressFill').style.width = ((quizState.reviewIndex + 1) / missed.length * 100) + '%';
  document.getElementById('quizScoreDisplay').textContent = 'Review';
  document.getElementById('quizStreakDisplay').textContent = '';
  document.getElementById('quizQNumText').textContent = 'Review ' + (quizState.reviewIndex + 1) + ' of ' + missed.length;
  document.getElementById('quizQuestionText').textContent = q.question;

  const optionsEl = document.getElementById('quizOptions');
  clearEl(optionsEl);
  const keys = ['1', '2', '3', '4'];
  q.options.forEach((opt, i) => {
    const div = document.createElement('div');
    div.className = 'quiz-option locked';
    if (i === answer.selected) div.classList.add('wrong');
    if (i === q.correctIndex) { div.classList.add('correct'); div.classList.remove('locked'); }
    const key = document.createElement('span');
    key.className = 'opt-key';
    key.textContent = keys[i];
    const txt = document.createElement('span');
    txt.textContent = opt;
    div.appendChild(key); div.appendChild(txt);
    optionsEl.appendChild(div);
  });

  // Explanation (safe DOM)
  const explEl = document.getElementById('quizExplanation');
  clearEl(explEl);
  explEl.appendChild(makeStrong('You answered: '));
  explEl.appendChild(document.createTextNode(answer.selected >= 0 ? q.options[answer.selected] : 'No answer'));
  explEl.appendChild(document.createElement('br'));
  explEl.appendChild(makeStrong('Correct: '));
  explEl.appendChild(document.createTextNode(q.options[q.correctIndex]));
  explEl.appendChild(document.createElement('br'));
  explEl.appendChild(document.createTextNode(q.explanation));
  explEl.classList.add('visible');

  if (q.highlightNodes.length > 0) {
    document.getElementById('quizViewGraph').classList.add('visible');
    highlightQuizNodes(q.highlightNodes);
    zoomToNodes(q.highlightNodes);
    if (q.highlightEdge) {
      highlightQuizEdge(q.highlightEdge.source, q.highlightEdge.target);
      animatePathDot(q.highlightEdge.source, q.highlightEdge.target);
    }
  }

  document.getElementById('quizNextBtn').disabled = false;
  document.getElementById('quizNextBtn').textContent = quizState.reviewIndex < missed.length - 1 ? 'Next Missed' : 'Back to Results';

  // Rebind next for review navigation
  const nextBtn = document.getElementById('quizNextBtn');
  const newNext = nextBtn.cloneNode(true);
  nextBtn.parentNode.replaceChild(newNext, nextBtn);
  newNext.addEventListener('click', () => {
    quizState.reviewIndex++;
    clearQuizNodeStyles();
    reviewMissed(missed);
  });
}

document.getElementById('quizRetryBtn').addEventListener('click', () => {
  quizState.currentIndex = 0;
  quizState.answers = [];
  quizState.score = 0;
  quizState.streak = 0;
  quizState.bestStreak = 0;
  quizState.startTime = Date.now();
  quizState.endTime = null;
  quizState.sectionScores = {};
  quizState.screen = 'quiz';
  quizState.reviewMode = false;
  quizState.questions = shuffle(quizState.questions);
  showQuizScreen('quizActive');
  rebindNextButton();
  showQuestion(0);
});

document.getElementById('quizNewBtn').addEventListener('click', () => {
  quizState.screen = 'setup';
  quizState.reviewMode = false;
  showQuizScreen('quizSetup');
  clearQuizNodeStyles();
  rebindNextButton();
});

function rebindNextButton() {
  const nextBtn = document.getElementById('quizNextBtn');
  const newNext = nextBtn.cloneNode(true);
  nextBtn.parentNode.replaceChild(newNext, nextBtn);
  newNext.addEventListener('click', nextQuestion);
  newNext.textContent = 'Next Question';
  document.getElementById('quizQuitBtn').style.display = '';
}

// ═══════════════════════════════════════════════════════════════
// MASTERY HEAT MAP
// ═══════════════════════════════════════════════════════════════

const btnMastery = document.getElementById('btnMastery');
if (Object.keys(loadMastery()).length > 0) btnMastery.style.display = '';

btnMastery.addEventListener('click', () => {
  quizState.masteryVisible = !quizState.masteryVisible;
  btnMastery.classList.toggle('mastery-active', quizState.masteryVisible);
  if (quizState.masteryVisible) applyMasteryHeatMap();
  else clearMasteryHeatMap();
});

function applyMasteryHeatMap() {
  const mastery = loadMastery();
  nodeElements.selectAll('circle').each(function(d) {
    if (d.type !== 'topic') return;
    const m = mastery[d.name];
    const el = d3.select(this);
    if (!m) {
      el.attr('fill', 'var(--bg-tertiary)').attr('stroke', 'var(--text-muted)').attr('stroke-width', 1).attr('stroke-dasharray', '2,2');
    } else {
      const ratio = m.correct / m.attempts;
      const color = ratio >= 0.8 ? '#4caf7a' : ratio >= 0.5 ? '#f28e2b' : '#e15759';
      el.attr('fill', color + '33').attr('stroke', color).attr('stroke-width', 3).attr('stroke-dasharray', '');
    }
  });
}

function clearMasteryHeatMap() {
  nodeElements.selectAll('circle').each(function(d) {
    const el = d3.select(this);
    if (d.type === 'root') {
      el.attr('fill', 'var(--accent)').attr('stroke', '#2a9d6e').attr('stroke-width', 3).attr('stroke-dasharray', '');
    } else if (d.type === 'section') {
      el.attr('fill', sectionColors[d.sectionIndex]).attr('stroke', 'none').attr('stroke-width', 0).attr('stroke-dasharray', '');
    } else {
      el.attr('fill', sectionColors[d.sectionIndex] + '33').attr('stroke', sectionColors[d.sectionIndex]).attr('stroke-width', 2).attr('stroke-dasharray', '');
    }
  });
}

// ═══════════════════════════════════════════════════════════════
// KEYBOARD SHORTCUTS
// ═══════════════════════════════════════════════════════════════

document.addEventListener('keydown', (e) => {
  if (!quizState.active) return;
  if (e.key === 'Escape') {
    if (quizState.reviewMode) {
      quizState.reviewMode = false;
      quizState.screen = 'results';
      showQuizScreen('quizResults');
      document.getElementById('quizQuitBtn').style.display = '';
      clearQuizNodeStyles();
      rebindNextButton();
    } else {
      exitQuizMode();
    }
    return;
  }
  if (quizState.screen !== 'quiz') return;
  const num = parseInt(e.key);
  if (num >= 1 && num <= 4) {
    const opts = document.querySelectorAll('#quizOptions .quiz-option');
    if (opts.length >= num && !opts[0].classList.contains('locked')) submitAnswer(num - 1);
    return;
  }
  if (e.key === 'Enter') {
    const nextBtn = document.getElementById('quizNextBtn');
    if (!nextBtn.disabled) nextBtn.click();
  }
});

</script>
